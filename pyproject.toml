# ECDAT tool configuration.
# Deliberately tool-only: the repo is run in-place (see [tool.pytest.ini_options]
# pythonpath) and is not published as a distribution, so there is no [project]
# or [build-system] table yet.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "validation: asserts a produced CBOM validates against the official CycloneDX schema",
    "docker: needs Docker and a real image present locally; skips itself otherwise",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "possibly-undefined",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# bcc ships no type stubs, and it lives in the SYSTEM python rather than this
# venv -- the agent imports it lazily so everything else stays testable without
# it (ADR-0009). mypy cannot see it here and should not pretend to.
[[tool.mypy.overrides]]
module = "bcc.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88
# Scanner fixtures are deliberately-bad cryptographic code: undefined names,
# hard-coded keys and retired ciphers are the point of them. Linting them would
# mean "fixing" the very constructs the scanners exist to detect, and
# reformatting them would move the lines an answer key is measured against.
extend-exclude = ["testdata"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "ARG",  # flake8-unused-arguments
    "TID",  # flake8-tidy-imports
    "S",    # flake8-bandit (offline/read-only guarantees are security-critical)
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # asserts are the point of a test
    "S311",  # shuffling test inputs is not a cryptographic use of randomness
    "ARG002",  # protocol-conforming fakes must accept args they ignore
]

[tool.ruff.lint.isort]
known-first-party = ["core"]
