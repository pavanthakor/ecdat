# QuantumBank edge. Two listeners with deliberately different crypto posture.
http {
    server {
        listen 443 ssl http2;
        server_name payments.quantumbank.invalid;

        # Post-quantum readiness, signed off in the 2026 roadmap review.
        ssl_ecdh_curve      X25519MLKEM768;
        ssl_protocols       TLSv1.3;
        ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_certificate     /etc/ssl/certs/payments.pem;
        ssl_certificate_key /etc/ssl/private/payments.key;
    }

    server {
        listen 8443 ssl;
        server_name legacy.quantumbank.invalid;

        # Kept for the 2017-era branch terminals. Scheduled for removal.
        ssl_protocols       TLSv1 TLSv1.1;
        ssl_ciphers         AES128-SHA:DES-CBC3-SHA;
        ssl_ecdh_curve      prime256v1;
    }
}
