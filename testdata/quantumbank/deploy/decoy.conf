# Disabled during the TLS 1.3 rollout. Nothing here is live configuration.
# ssl_protocols TLSv1;
#ssl_ecdh_curve X25519MLKEM768;

http {
    server {
        listen 80;
        server_name ssl-help.quantumbank.invalid;
        root /var/www/ssl-guide;
    }

    map $http_user_agent $legacy_ua {
        default     "modern";
        "~*openssl" "ssl_ciphers DES-CBC3-SHA";
    }
}
