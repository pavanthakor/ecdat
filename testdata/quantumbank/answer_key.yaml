    redacted: true

  # ---- OBSERVED (runtime spool) ----------------------------------------
  - id: observed-tls13
    scanner: runtime-spool
    view: observed
    algorithm: TLS
    asset_type: protocol
    locator_contains: "host:"
    endpoint: null
    count: 1
    known_gap: false
  - id: observed-aes256-suite
    scanner: runtime-spool
    view: observed
    algorithm: TLS_AES_256_GCM_SHA384
    locator_contains: "host:"
    endpoint: null
    count: 1
    known_gap: false
  - id: observed-classical-group
    scanner: runtime-spool
    view: observed
    algorithm: x25519
    locator_contains: "host:"
    endpoint: null
    count: 1
    known_gap: false

decoys:
  - services/auth/decoys.py
  - deploy/decoy.conf

drifts:
  - id: r1-payments-shipped-cannot
    kind: shipped-cannot-do-declared
    endpoint: payments.quantumbank.invalid:443
    declared: X25519MLKEM768
    observed_contains: "3.0.2"
  - id: r2-payments-classical
    kind: declared-pqc-observed-classical
    endpoint: payments.quantumbank.invalid:443
    declared: X25519MLKEM768
    observed_contains: x25519
  # The system-wide OpenSSL policy asks for the same hybrid group, and the
  # shipped libssl cannot provide it either. This one was NOT in the first
  # draft of this file -- it was written down as an agreement case, the harness
  # reported it as invented drift, and the tool turned out to be right. Left
  # here as a reminder that the answer key is a claim like any other.
  - id: r1-openssl-policy-shipped-cannot
    kind: shipped-cannot-do-declared
    endpoint: openssl@quantumbank
    declared: X25519MLKEM768
    observed_contains: "3.0.2"

# Agreement cases: any drift attributed to these is INVENTED and is a
# precision failure.
non_drifts:
  - endpoint: sshd@quantumbank
    why: >-
      SSH key-exchange policy has no TLS declaration for a handshake to
      contradict, and its scope marker is deliberately not endpoint-shaped so
      it cannot be joined against one (ADR-0013).

# Drift that is neither expected nor invented: a KNOWN CONSEQUENCE of the
# observed view carrying no endpoint (ADR-0012). A uprobe sees a process, not a
# listening socket, so an observed handshake wildcard-joins every declared
# endpoint in the system -- and produces plausible but unattributable drift
# against the ones it did not actually occur on.
#
# Printed every run and excluded from precision, for the same reason known_gap
# findings are: scoring them as correct would overstate the tool, and scoring
# them as invented would understate it. Neither is true. The fix is
# socket-level attribution in the probe.
attribution_limited:
  - endpoint: legacy.quantumbank.invalid:8443
    why: >-
      the observed handshake cannot be attributed to a listener, so its
      AES-256 suite is compared against the legacy endpoint's cipher list too
  - endpoint: openssl@quantumbank
    kind: declared-pqc-observed-classical
    why: >-
      the same handshake is compared against the system-wide policy, which is
      a scope rather than an endpoint
