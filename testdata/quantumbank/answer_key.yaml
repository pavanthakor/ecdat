# QuantumBank ground truth -- the CONTRACT for the KPI harness (ADR-0014).
#
# ---------------------------------------------------------------------------
# THE RULE THIS FILE EXISTS TO ENFORCE
# ---------------------------------------------------------------------------
# Every artefact planted in testdata/quantumbank/ is listed here, INCLUDING the
# ones ECDAT cannot currently detect. Those carry `known_gap: true`: they are
# excluded from the recall denominator, and the harness PRINTS them as
# "known gap" lines every run.
#
# The alternative -- quietly leaving undetectable artefacts out of the fixture
# -- produces a better-looking number by making the test easier, which is the
# oldest way to lie with a benchmark. A recall figure is only meaningful
# alongside the list of what it declined to measure.
#
# ---------------------------------------------------------------------------
# SCHEMA
# ---------------------------------------------------------------------------
# findings[]:
#   id                 stable name, used in the miss report
#   scanner            which scanner should find it (source/config/container/
#                      runtime-spool)
#   view               declared | shipped | observed
#   algorithm          canonical algorithm name as it must appear in the CBOM
#   locator_contains   substring the evidence locator must contain -- this is
#                      what ties a finding to the file it was planted in
#   endpoint           expected ecdat:param:endpoint, or null
#   count              how many findings this artefact should produce
#   known_gap          true = we cannot detect this yet; excluded from recall,
#                      printed every run
#   note               why, for a known_gap
#
# decoys[]: locator substrings. ANY finding from these is a precision failure,
#           counted rather than ignored.
#
# drifts[]:     drift that MUST be found (kind + endpoint + declared/observed)
# non_drifts[]: agreement cases that must produce NO drift, so invented drift
#               is measurable rather than merely hoped against.

findings:
  # ---- SOURCE (Scanner A, Python) --------------------------------------
  - id: auth-rsa-keygen
    scanner: source
    view: declared
    algorithm: RSA
    locator_contains: services/auth/tokens.py
    endpoint: null
    count: 1
    known_gap: false
  - id: auth-jwt-rs256
    scanner: source
    view: declared
    algorithm: RSA
    locator_contains: services/auth/tokens.py
    endpoint: null
    count: 1
    known_gap: false
  - id: auth-md5-passwords
    scanner: source
    view: declared
    algorithm: MD5
    locator_contains: services/auth/passwords.py
    endpoint: null
    count: 1
    known_gap: false
  - id: auth-os-urandom
    scanner: source
    view: declared
    algorithm: CSPRNG
    locator_contains: services/auth/passwords.py
    endpoint: null
    count: 1
    known_gap: false
  - id: auth-aes-cbc
    scanner: source
    view: declared
    algorithm: AES
    locator_contains: services/auth/vault.py
    endpoint: null
    count: 1
    known_gap: false
  - id: auth-hardcoded-key
    scanner: source
    view: declared
    algorithm: AES
    asset_type: key
    locator_contains: services/auth/vault.py
    endpoint: null
    count: 1
    known_gap: false
    redacted: true

  # ---- SOURCE, Go (was a known gap until ADR-0023) ---------------------
  - id: gateway-ecdsa-p256
    scanner: source
    view: declared
    algorithm: ECDSA
    locator_contains: services/gateway/sign.go
    endpoint: null
    count: 1
    known_gap: false
    note: >-
      DETECTED since ADR-0023. Was a known gap while Scanner A was Python-only
      (ADR-0004); the Go rule pack (`go-ecdsa-keygen`) reads it now and
      captures curve=P256, so it counts toward recall instead of being excluded
      from the denominator.
  - id: gateway-embedded-cert
    scanner: source
    view: declared
    algorithm: unknown
    asset_type: certificate
    locator_contains: services/gateway/sign.go
    endpoint: null
    count: 1
    known_gap: false
    note: >-
      DETECTED since ADR-0023. The PEM rule used to be scoped to
      `languages: [python]`; `go-pem-block` covers .go files now, and the
      snippet is redacted, so the certificate is inventoried without its bytes
      reaching the CBOM.

  # ---- CONFIG (endpoint-oriented declared view) ------------------------
  - id: payments-hybrid-group
    scanner: config
    view: declared
    algorithm: X25519MLKEM768
    locator_contains: deploy/nginx.conf
    endpoint: payments.quantumbank.invalid:443
    count: 1
    known_gap: false
  - id: payments-tls13
    scanner: config
    view: declared
    algorithm: TLS
    asset_type: protocol
    locator_contains: deploy/nginx.conf
    endpoint: payments.quantumbank.invalid:443
