  - id: openssl-policy-groups
    scanner: config
    view: declared
    algorithm: X25519MLKEM768
    locator_contains: deploy/openssl.cnf
    endpoint: openssl@quantumbank
    count: 1
    known_gap: false
  - id: openssl-policy-minproto
    scanner: config
    view: declared
    algorithm: TLS
    asset_type: protocol
    locator_contains: deploy/openssl.cnf
    endpoint: openssl@quantumbank
    count: 1
    known_gap: false

  # ---- CONTAINER (shipped) ---------------------------------------------
  - id: payments-libssl-302
    scanner: container
    view: shipped
    algorithm: OpenSSL
    locator_contains: var/lib/dpkg/status
    endpoint: null
    count: 1
    known_gap: false
  - id: payments-shipped-cert
    scanner: container
    view: shipped
    algorithm: RSA
    asset_type: certificate
    locator_contains: etc/ssl/certs/payments.pem
    endpoint: null
