# fixit fixture: a TLS terminator still pinned to retired protocol versions.
# The cipher list and the group are already modern, so this file exercises the
# nginx-weak-protocol template and nothing else.
http {
    server {
        listen 443 ssl;
        server_name legacy.example.invalid;

        ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_ecdh_curve      X25519MLKEM768;
    }
}
