# Every directive here LOOKS like crypto configuration and is not. Any finding
# from this file is a false positive.

# A commented-out directive. Real once, disabled now.
#   ssl_protocols TLSv1;
#ssl_ecdh_curve X25519MLKEM768;
# ssl_ciphers DES-CBC3-SHA;

http {
    # A server block with no TLS at all: plain HTTP, and a server_name that
    # merely mentions ssl.
    server {
        listen 80;
        server_name ssl-docs.quantumbank.invalid;
        root /var/www/ssl-guide;
    }

    # A map block is not an ssl context; a value that happens to read like a
    # cipher list is data, not configuration.
    map $http_user_agent $legacy_note {
        default          "none";
        "~*openssl"      "ssl_ciphers DES-CBC3-SHA";
    }
}
