# ECDAT config-scanner fixture. Two server blocks with DIFFERENT crypto, so
# endpoint attribution is testable: a finding must land on the block it came
# from, never on the file.
http {
    # Global default, no server block of its own.
    ssl_session_timeout 10m;

    server {
        listen 443 ssl http2;
        server_name api.quantumbank.invalid;

        # The hybrid post-quantum group the drift beat turns on.
        ssl_ecdh_curve          X25519MLKEM768;
        ssl_protocols           TLSv1.3;
        ssl_ciphers             TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_certificate         /etc/ssl/certs/api.pem;
        ssl_certificate_key     /etc/ssl/private/api.key;
    }

    server {
        listen 8443 ssl;
        server_name legacy.quantumbank.invalid;

        ssl_protocols           TLSv1 TLSv1.1;
        ssl_ciphers             AES128-SHA:DES-CBC3-SHA;
        ssl_ecdh_curve          prime256v1;
    }
}
