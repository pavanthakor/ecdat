# Java signatures and RSA key transport.
#
# Sources:
#   NIST IR 8547 -- RSA and ECDSA signatures deprecated after 2030, disallowed
#     after 2035.
#   NIST SP 800-131A Rev.2 -- SHA-1 disallowed for signature generation since
#     2013; DSA disallowed for signature generation.
#   SHAttered (Stevens et al., 2017) -- practical SHA-1 collision.
#   RFC 8017 (PKCS#1 v2.2) -- RSAES-OAEP and RSASSA-PSS.
#   Java Security Standard Algorithm Names (JDK 21) -- the `Signature`
#     transformation grammar is "<digest>with<encryption>".
#
# THE DIGEST IS HALF THE SIGNATURE. `SHA1withRSA` on a 4096-bit key is
# forgeable through the digest, and the key size is irrelevant to that: a
# chosen-prefix collision produces two messages with one valid signature. So
# the weak-digest case is its OWN rule and carries `flagged`, rather than being
# one more RSA finding that a reader has to inspect the transformation string
# to understand.
rules:
  - id: java-signature-weak-hash
    languages: [java]
    severity: ERROR
    message: "ecdat|transformation=$T"
    metadata:
      algorithm: RSA
      primitive: signature
      usage: sign
      asset_type: algorithm
      capture:
        transformation: $T
      quantum_note: >-
        A signature over a BROKEN DIGEST. SHA-1 collision resistance fell in
        2017 (SHAttered) and MD5's a decade before that (RFC 6151); NIST SP
        800-131A Rev.2 has disallowed SHA-1 for signature generation since
        2013. The RSA key size does not help -- a chosen-prefix collision
        yields two documents sharing one valid signature whatever the modulus.
        Fix the digest first (SHA-256, FIPS 180-4), then migrate the signature
        itself to ML-DSA (FIPS 204) before 2035 (NIST IR 8547).
      flags: [weak, quantum-vulnerable, critical]
    patterns:
      - pattern: Signature.getInstance($T, ...)
      - metavariable-regex:
          metavariable: $T
          regex: ^"(SHA1|SHA-1|MD5|MD2)with

  - id: java-signature-rsa
    languages: [java]
    severity: WARNING
    message: "ecdat|transformation=$T"
    metadata:
      algorithm: RSA
      primitive: signature
      usage: sign
      asset_type: algorithm
      capture:
        transformation: $T
      quantum_note: >-
        An RSA signature (PKCS#1 v1.5 or PSS, RFC 8017). The digest is sound;
        the signature scheme is not, long-term -- RSA is broken outright by
        Shor's algorithm, deprecated after 2030 and disallowed after 2035
        (NIST IR 8547). Replace with ML-DSA (FIPS 204), or a composite
        RSA+ML-DSA signature during transition.
      flags: [quantum-vulnerable]
    patterns:
      - pattern: Signature.getInstance($T, ...)
      - metavariable-regex:
          metavariable: $T
          regex: ^"SHA-?(224|256|384|512)with(RSA|RSAandMGF1)

  - id: java-signature-ecdsa
    languages: [java]
    severity: WARNING
    message: "ecdat|transformation=$T"
    metadata:
      algorithm: ECDSA
      primitive: signature
      usage: sign
      asset_type: algorithm
      capture:
        transformation: $T
      quantum_note: >-
        An ECDSA signature. The elliptic-curve discrete log is broken by Shor
        with fewer logical qubits than RSA-2048 needs, so EC falls first;
        deprecated after 2030 and disallowed after 2035 (NIST IR 8547).
        Replace with ML-DSA (FIPS 204) or SLH-DSA (FIPS 205).
      flags: [quantum-vulnerable]
    patterns:
      - pattern: Signature.getInstance($T, ...)
      - metavariable-regex:
          metavariable: $T
          regex: ^"SHA-?(224|256|384|512)with(ECDSA|DSA)

  - id: java-cipher-rsa
    languages: [java]
    severity: WARNING
    message: "ecdat|transformation=$T"
    metadata:
      algorithm: RSA
      primitive: pke
      usage: key-transport
      asset_type: algorithm
      capture:
        transformation: $T
      quantum_note: >-
        RSA used as a CIPHER is key transport -- wrapping a symmetric key, not
        bulk encryption. That makes it the harvest-now-decrypt-later case: a
        recorded ciphertext is decryptable once a cryptanalytically relevant
        quantum computer exists, so the exposure starts on the day the traffic
        is captured rather than in 2035. Broken outright by Shor; disallowed
        after 2035 (NIST IR 8547). Replace with ML-KEM (FIPS 203). Note that
        usage here is key-transport, NOT signature -- the replacement differs.
      flags: [quantum-vulnerable]
    patterns:
      - pattern: Cipher.getInstance($T, ...)
      - metavariable-regex:
          metavariable: $T
          regex: ^"RSA(/|")
