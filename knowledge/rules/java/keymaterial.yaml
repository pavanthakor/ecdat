# Key material embedded in Java source.
#
# Sources:
#   NIST SP 800-57 Part 1 Rev.5 s5.3 -- key material must be protected for its
#     whole lifetime; a key in source control has no lifetime bound at all.
#   NIST SP 800-133 Rev.2 -- keys must come from an approved RBG, not a literal.
#   CWE-321 (hard-coded cryptographic key), CWE-798 (hard-coded credentials).
#   RFC 7468 -- textual encodings of PKIX/PKCS structures (the PEM banners).
#   ITU-T X.690 s8.1.3 -- DER length octets: the `MII` / `MIG` header shape.
#   JCA -- SecretKeySpec(key, alg), IvParameterSpec(iv), GCMParameterSpec(tLen,
#     iv); auth0 java-jwt -- Algorithm.HMAC256/384/512(secret); jjwt --
#     Keys.hmacShaKeyFor(bytes), signWith(SignatureAlgorithm, secret). The key
#     parameters the sink rule knows.
#
# A hard-coded key in Java is usually a `static final String` or a
# `SecretKeySpec` over a literal, and it ships inside the JAR: anyone who can
# read the artefact can read the key, and decompiling is not required because
# string constants sit in the class file's constant pool in plain text.
#
# CORROBORATION, NOT A NAME (ADR-0034). Until ADR-0034 `java-hardcoded-key`
# fired on any key-ish NAME holding a literal -- a cookie name, a header name,
# a property key. A name is not evidence. A literal is reported only when
# something corroborates it:
#
#   java-pem-block                a PEM block                  confidence 1.0
#   java-hardcoded-key-der        a base64 DER structure       confidence 1.0
#   java-hardcoded-key            it reaches a key, IV, HMAC   confidence 1.0
#                                 or signing parameter
#   java-hardcoded-key-candidate  a key-ish name, a high-      confidence 0.5,
#                                 entropy 32+ character        marked `candidate`
#                                 literal, and nothing else
#
# REDACTION. Every rule sets `redact: true`, so the snippet becomes
# `<redacted key material>` before it reaches a Finding. `redact` does NOT
# sanitise the message, so no rule interpolates a metavariable that can bind to
# the secret: the sink rule and the candidate carry only `holder=`, the
# IDENTIFIER the literal was declared under. No metavariable here is a prefix of
# `$HOLDER` or `$NAME` -- semgrep substitutes a bound metavariable into any
# longer, UNBOUND name it prefixes (measured, ADR-0034 STEP 0).
#
# The fixture also exercises the CROSS-RULE case on purpose: the AES-CBC rule
# matches `JavaHardcodedKey.java` too, and it has no `redact` flag and no idea
# a key is in the file. The independent PEM/length scrub in
# `scanners/source/_redact` is what has to hold there, and
# tests/test_rules_java.py asserts on that rule's findings specifically.
rules:
  - id: java-hardcoded-key
    languages: [java]
    severity: ERROR
    message: "ecdat|holder=$HOLDER"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      holder_metavar: $HOLDER
      quantum_note: >-
        A literal that reaches a key, IV, HMAC-key or signing-secret parameter:
        hard-coded key material, corroborated by where it goes rather than by
        what it is called. Everyone with repository access has the key, it
        survives in git history after removal, it ships in the JAR's constant
        pool where no decompiler is needed to read it, and rotating it needs a
        code change and a redeploy (CWE-321; NIST SP 800-57 Part 1 Rev.5 s5.3).
        Quantum is irrelevant -- there is nothing to break. Load it from a KMS
        or keystore, generated by SecureRandom (NIST SP 800-133 Rev.2).
      flags: [key-material, critical]
    mode: taint
    options:
      # A call's result is not its arguments. Without this, the "PBKDF2..."
      # and salt literals flowed through SecretKeyFactory into the key spec
      # and were reported as the key (STEP 0). `getBytes()` is re-admitted
      # below, as a propagator and as sink shapes.
      taint_assume_safe_functions: true
      # With propagation on, a constant-backed argument ALSO matched the
      # literal source at its use, and the key was reported twice.
      constant_propagation: false
    pattern-sources:
      # A literal that initialises a named holder: a field with any modifiers
      # (semgrep normalises them away) or a local. The holder travels to the
      # message.
      - patterns:
          - pattern-either:
              - pattern-inside: $TYPE $HOLDER = "...";
              - pattern-inside: $TYPE $HOLDER = "...".getBytes(...);
          - pattern: '"$LIT"'
          # Eight characters or more -- a DES key, the shortest worth
          # protecting -- and never a PEM or DER literal: java-pem-block and
          # java-hardcoded-key-der own a SHAPED literal, so it is reported once.
          - metavariable-regex:
              metavariable: $LIT
              regex: '^(?![\s\S]*-----(?:BEGIN|END))(?!MI[IG][A-Za-z0-9+/]{61})[\s\S]{8,}$'
      # A literal written anywhere else -- inline at the sink -- holds nothing.
      - patterns:
          - pattern: '"$LIT"'
          - pattern-not-inside: $TYPE $VARNAME = "...";
          - pattern-not-inside: $TYPE $VARNAME = "...".getBytes(...);
          - metavariable-regex:
              metavariable: $LIT
              regex: '^(?![\s\S]*-----(?:BEGIN|END))(?!MI[IG][A-Za-z0-9+/]{61})[\s\S]{8,}$'
    pattern-propagators:
      - pattern: $TO = $FROM.getBytes(...)
        from: $FROM
        to: $TO
    pattern-sanitizers:
      # An ASSEMBLED key -- a constant joined to a runtime value -- is not a
      # hard-coded key: the literal is a part of it. This is also what stops a
      # PEM written as `"-----BEGIN...\n" + "body\n" + ...` leaking through its
      # unbannered middle lines (STEP 0).
      - pattern: $LEFT + $RIGHT
    # One sink per shape: two shapes that match the SAME call must not share a
    # pattern-either -- semgrep keeps one binding per range (STEP 0).
    pattern-sinks:
      - patterns:
          - pattern: new SecretKeySpec($ARG, ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: new SecretKeySpec($ARG.getBytes(...), ...)
          - focus-metavariable: $ARG
      # The IV.
      - patterns:
          - pattern: new IvParameterSpec($ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: new IvParameterSpec($ARG.getBytes(...))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: new GCMParameterSpec($TLEN, $ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: new GCMParameterSpec($TLEN, $ARG.getBytes(...))
          - focus-metavariable: $ARG
      # The JWT HMAC secret.
      - patterns:
          - pattern: Keys.hmacShaKeyFor($ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: Keys.hmacShaKeyFor($ARG.getBytes(...))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: Algorithm.HMAC256($ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: Algorithm.HMAC256($ARG.getBytes(...))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: Algorithm.HMAC384($ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: Algorithm.HMAC384($ARG.getBytes(...))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: Algorithm.HMAC512($ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: Algorithm.HMAC512($ARG.getBytes(...))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: $BUILDER.signWith(SignatureAlgorithm.$SIGALG, $ARG)
          - focus-metavariable: $ARG

  - id: java-hardcoded-key-der
    languages: [java]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      quantum_note: >-
        A base64 DER structure embedded in source: key material by its shape.
        `MII` / `MIG` is a DER SEQUENCE with a long-form length (ITU-T X.690
        s8.1.3) -- the header of every RSA key (RFC 8017), PKCS #8 key (RFC
        5958) and X.509 certificate (RFC 5280). It is deliberately not decoded,
        because reading the DER would mean reading the key, so it may be a
        private key (CWE-321), a public key or a certificate; any of them here
        ships in the JAR and is rotated only by a rebuild and a redeploy.
      flags: [key-material, critical]
    options:
      # With propagation on, the literal ALSO matched at every use of its
      # constant, and one blob was reported once per use (STEP 0).
      constant_propagation: false
    patterns:
      - pattern: '"$LIT"'
      # A SEQUENCE of 128+ bytes. The short forms (Ed25519, X25519, P-256
      # SEC1) share no header distinct from base64 text that starts with "0"
      # (STEP 0), so they are left to the other branches.
      - metavariable-regex:
          metavariable: $LIT
          regex: '^MI[IG][A-Za-z0-9+/]{61,}'
      # A DER line inside a PEM block -- one chunk of a `+`-joined PEM -- is
      # java-pem-block's.
      - pattern-not-regex: '-----BEGIN[A-Z0-9 ]*-----[\s\S]*?-----END[A-Z0-9 ]*-----'

  - id: java-hardcoded-key-candidate
    languages: [java]
    severity: WARNING
    message: "ecdat|holder=$NAME"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      holder_metavar: $NAME
      # A string: semgrep 1.176.1 refuses a YAML float anywhere in a rule.
      confidence: "0.5"
      quantum_note: >-
        A CANDIDATE for analyst review, not an assertion: a key-ish name holding
        a high-entropy literal of 32 or more hex or base64 characters that ECDAT
        did not see reach a key parameter. It may be a key used through a helper
        or another class -- OSS taint is intra-procedural -- or an API token, a
        test vector, a digest named like a key. If it is a key, it is CWE-321
        (NIST SP 800-57 Part 1 Rev.5 s5.3): move it to a KMS or keystore.
      flags: [key-material, candidate]
    patterns:
      # A bare `String $NAME = ...;` matches a field with any modifiers --
      # semgrep normalises them away -- so `private static final` needs no
      # pattern of its own. Spelling one (`$MODS String $NAME = ...`) is not
      # valid Java pattern syntax and semgrep rejects the rule outright.
      - pattern-either:
          - pattern: String $NAME = $LITERAL;
          - pattern: byte[] $NAME = $LITERAL.getBytes(...);
      # The name is the premise, never the proof. `iv`, `nonce`, `salt` and
      # `token` are not here: none is a secret key, and `iv` is a substring of
      # `private` and `archive`.
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|secret|passphrase|password|passwd|credential).*
      # The shape: 32+ hex/base64 characters with a digit and a letter, the
      # whole literal, and not a DER header (java-hardcoded-key-der owns that).
      - metavariable-regex:
          metavariable: $LITERAL
          regex: '^"(?!MI[IG])(?=[^"]*[0-9])(?=[^"]*[A-Za-z])[A-Za-z0-9+/]{32,}={0,2}"$'
      # The entropy: semgrep's analyzer rejects repeating patterns
      # (`deadbeef` x4), prose and camelCase names, and accepts random hex and
      # base64 (STEP 0).
      - metavariable-analysis:
          analyzer: entropy
          metavariable: $LITERAL

  - id: java-pem-block
    languages: [java]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: certificate
      redact: true
      quantum_note: >-
        A PEM block embedded in source (RFC 7468). ECDAT records that key
        material or a certificate is present and where, and deliberately does
        not parse it: the algorithm and key size would mean reading the DER,
        and the point of this rule is that the bytes must not reach the CBOM at
        all. A private key here is CWE-321; a certificate here cannot be
        rotated without a rebuild and a redeploy.
      flags: [key-material, critical]
    patterns:
      - pattern-regex: -----BEGIN[A-Z0-9 ]*-----
