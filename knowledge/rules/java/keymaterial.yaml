# Key material embedded in Java source.
#
# Sources:
#   NIST SP 800-57 Part 1 Rev.5 s5.3 -- key material must be protected for its
#     whole lifetime; a key in source control has no lifetime bound at all.
#   NIST SP 800-133 Rev.2 -- keys must come from an approved RBG, not a literal.
#   CWE-321 (hard-coded cryptographic key), CWE-798 (hard-coded credentials).
#   RFC 7468 -- textual encodings of PKIX/PKCS structures (the PEM banners).
#
# A hard-coded key in Java is usually a `static final String` or a
# `SecretKeySpec` over a literal, and it ships inside the JAR: anyone who can
# read the artefact can read the key, and decompiling is not required because
# string constants sit in the class file's constant pool in plain text.
#
# BOTH rules set `redact: true`, so the snippet becomes
# `<redacted key material>` before it reaches a Finding. `redact` does NOT
# sanitise the message, so neither rule interpolates the metavariable that
# binds to the secret -- `message: "ecdat|"` and nothing else.
#
# The fixture also exercises the CROSS-RULE case on purpose: the AES-CBC rule
# matches `JavaHardcodedKey.java` too, and it has no `redact` flag and no idea
# a key is in the file. The independent PEM/length scrub in
# `scanners/source/_redact` is what has to hold there, and
# tests/test_rules_java.py asserts on that rule's findings specifically.
rules:
  - id: java-hardcoded-key
    languages: [java]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      quantum_note: >-
        A key or IV written as a literal in source. Everyone with repository
        access has the key, it survives in git history after removal, it ships
        in the JAR's constant pool where no decompiler is needed to read it,
        and rotating it needs a code change and a redeploy (CWE-321; NIST SP
        800-57 Part 1 Rev.5 s5.3). Quantum is irrelevant -- there is nothing to
        break. Load it from a KMS or keystore, generated by SecureRandom
        (NIST SP 800-133 Rev.2).
      flags: [key-material, critical]
    patterns:
      # A bare `String $NAME = ...;` matches a field with any modifiers --
      # semgrep normalises them away -- so `private static final` needs no
      # pattern of its own. Spelling one (`$MODS String $NAME = ...`) is not
      # valid Java pattern syntax and semgrep rejects the rule outright.
      - pattern-either:
          - pattern: String $NAME = $LITERAL;
          - pattern: byte[] $NAME = $LITERAL;
          - pattern: new SecretKeySpec($LITERAL, ...)
          - pattern: new IvParameterSpec($LITERAL)
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|secret|iv|nonce|salt|passphrase|password|credential).*
      # A PEM block is `java-pem-block`'s finding, not this rule's. Its holder
      # is usually named `SIGNING_KEY` or similar, so without this both rules
      # fire on one line and the inventory carries the same artefact twice.
      - pattern-not-regex: -----BEGIN
      # Anchored at the start (semgrep's metavariable-regex uses Python
      # `re.match`) and the bound content includes the quote. Eight characters
      # is a DES key -- the shortest literal worth treating as key material.
      - metavariable-regex:
          metavariable: $LITERAL
          regex: ^"[^"]{8,}"

  - id: java-pem-block
    languages: [java]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: certificate
      redact: true
      quantum_note: >-
        A PEM block embedded in source (RFC 7468). ECDAT records that key
        material or a certificate is present and where, and deliberately does
        not parse it: the algorithm and key size would mean reading the DER,
        and the point of this rule is that the bytes must not reach the CBOM at
        all. A private key here is CWE-321; a certificate here cannot be
        rotated without a rebuild and a redeploy.
      flags: [key-material, critical]
    patterns:
      - pattern-regex: -----BEGIN[A-Z0-9 ]*-----
