# Key material embedded in source.
#
# Sources:
#   RFC 7468 -- textual (PEM) encodings of keys and certificates.
#   ITU-T X.690 s8.1.3 -- DER length octets: the `MII` / `MIG` header shape.
#   NIST SP 800-57 Part 1 Rev.5 Sec. 5.3, 8.1.5 -- key material must be
#     protected for its whole lifetime; a key committed to a repository is
#     compromised the moment it is committed and must be treated as revoked.
#   OWASP ASVS v4.0.3 V6.4 -- secrets must not be embedded in source.
#   CWE-321 (hard-coded cryptographic key).
#   PyCryptodome / pyca cryptography / stdlib hmac / PyJWT -- AES.new(key),
#     algorithms.AES(key), DES3.new(key), algorithms.TripleDES(key),
#     algorithms.ChaCha20(key, nonce), Fernet(key), hmac.new(key),
#     hmac.HMAC(key), jwt.encode(payload, key). The key parameters the sink
#     rules know.
#
# CORROBORATION, NOT A NAME (ADR-0034). Python never had a name-scoped key rule
# -- py-hardcoded-cipher-key was anchored at the cipher from the start -- so the
# false-positive class ADR-0034 closed in Go, JS and Java does not exist here.
# What ADR-0034 brings to Python is the rest of the same model, so the four
# packs agree:
#
#   py-pem-private-key /        a PEM block                   confidence 1.0
#     py-pem-certificate
#   py-hardcoded-key-der        a base64 DER structure        confidence 1.0
#   py-hardcoded-cipher-key     it reaches an AES key         confidence 1.0
#   py-hardcoded-key            it reaches any other key,     confidence 1.0
#                               HMAC or signing parameter
#   py-hardcoded-key-candidate  a key-ish name, a high-       confidence 0.5,
#                               entropy 32+ character         marked `candidate`
#                               literal, and nothing else
#
# REDACTION CONTRACT. Every rule in this file sets `redact: true`, which makes
# the scanner replace the snippet with "<redacted key material>" instead of the
# matched line. Two consequences bind rule authors here:
#
#   1. No metavariable that could bind to key bytes may appear in `message`.
#      The message is the scanner's capture channel and is copied into the
#      Finding, so interpolating $K there would exfiltrate the very bytes the
#      rule exists to flag. The only thing any message here carries is
#      `holder=` -- the IDENTIFIER a literal was declared under, never the
#      literal -- which the scanner keeps out of params and discards unless it
#      is identifier-shaped. No metavariable is a prefix of `$HOLDER` or
#      `$NAME`: semgrep substitutes a bound metavariable into any longer,
#      UNBOUND name it prefixes (measured, ADR-0034 STEP 0).
#   2. `algorithm` records the surrounding cipher where the pattern makes it
#      unambiguous and `unknown` otherwise. It never records the key.
#
# ECDAT stores the FACT and the LOCATION of key material. It never stores the
# material. See ADR-0001 and PUNCHLIST #3.
rules:
  - id: py-pem-private-key
    languages: [python]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      quantum_note: >-
        A private key committed to source is compromised regardless of its
        algorithm (NIST SP 800-57 Pt.1 Rev.5 Sec. 5.3). Rotate first; only then
        is its quantum exposure worth scoring. The algorithm is deliberately
        left unknown -- the PEM banner is not parsed, because parsing it would
        mean reading the key.
      flags: [key-material, critical]
    pattern-regex: '-----BEGIN (?:[A-Z0-9 ]+ )?PRIVATE KEY-----'

  - id: py-pem-certificate
    languages: [python]
    severity: WARNING
    message: "ecdat|"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: certificate
      redact: true
      quantum_note: >-
        A certificate pinned in source freezes a trust decision at authoring
        time and will outlive the migration window it was written in. Its
        signature algorithm and validity are scored by the certificate scanner,
        which parses it out of band; this rule only records that source carries
        one.
      flags: [key-material]
    pattern-regex: '-----BEGIN CERTIFICATE-----'

  # The AES branch keeps its id and its `algorithm: AES`: it is what the
  # QuantumBank KPI and every stored scan already call this artefact. Taint
  # since ADR-0034 -- it used to match only a literal constant-propagated into
  # `AES.new("...")`.
  - id: py-hardcoded-cipher-key
    languages: [python]
    severity: ERROR
    message: "ecdat|holder=$HOLDER"
    metadata:
      algorithm: AES
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      holder_metavar: $HOLDER
      quantum_note: >-
        A symmetric key literal in source that reaches an AES key parameter
        (OWASP ASVS V6.4; CWE-321). Every holder of the repository holds the
        key, so the cipher's strength is irrelevant -- AES-256 with a committed
        key protects nothing. Rotate and move to a KMS or an injected secret.
      flags: [key-material, critical]
    mode: taint
    options:
      # A call's result is not its arguments. Without this, a PBKDF2 salt
      # literal flowed through `kdf.derive()` into AES.new and was reported as
      # the key (STEP 0). `.encode()` is re-admitted below.
      taint_assume_safe_functions: true
      # With propagation on, a constant-backed argument ALSO matched the
      # literal source at its use, and the key was reported twice.
      constant_propagation: false
    pattern-sources: &py-key-sources
      # A literal that initialises a named holder -- a module constant, a
      # local, an attribute. The holder travels to the message.
      - patterns:
          - pattern-either:
              - pattern-inside: $HOLDER = "..."
              - pattern-inside: $HOLDER = b"..."
              - pattern-inside: $HOLDER = "...".encode(...)
          - pattern: '"$LIT"'
          # Eight characters or more -- a DES key, the shortest worth
          # protecting -- and never a PEM or DER literal: the PEM rules and
          # py-hardcoded-key-der own a SHAPED literal, so it is reported once.
          - metavariable-regex:
              metavariable: $LIT
              regex: '^(?![\s\S]*-----(?:BEGIN|END))(?!MI[IG][A-Za-z0-9+/]{61})[\s\S]{8,}$'
      # A literal written anywhere else -- inline at the sink -- holds nothing.
      - patterns:
          - pattern: '"$LIT"'
          - pattern-not-inside: $VARNAME = "..."
          - pattern-not-inside: $VARNAME = b"..."
          - pattern-not-inside: $VARNAME = "...".encode(...)
          - metavariable-regex:
              metavariable: $LIT
              regex: '^(?![\s\S]*-----(?:BEGIN|END))(?!MI[IG][A-Za-z0-9+/]{61})[\s\S]{8,}$'
    pattern-propagators: &py-key-propagators
      - pattern: $TO = $FROM.encode(...)
        from: $FROM
        to: $TO
    pattern-sanitizers: &py-key-sanitizers
      # An ASSEMBLED key is py-assembled-key-material's finding (ADR-0026), not
      # a hard-coded one: the literal is only a part of the key.
      - pattern: $LEFT + $RIGHT
    # One sink per shape: two shapes that match the SAME call must not share a
    # pattern-either -- semgrep keeps one binding per range (STEP 0).
    pattern-sinks:
      - patterns:
          - pattern: AES.new($ARG, ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: AES.new($ARG.encode(...), ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: algorithms.AES($ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: algorithms.AES($ARG.encode(...))
          - focus-metavariable: $ARG

  - id: py-hardcoded-key
    languages: [python]
    severity: ERROR
    message: "ecdat|holder=$HOLDER"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      holder_metavar: $HOLDER
      quantum_note: >-
        A literal that reaches a key, HMAC-key or signing-secret parameter other
        than AES's: hard-coded key material, corroborated by where it goes
        rather than by what it is called (OWASP ASVS V6.4; CWE-321). Every
        holder of the repository holds the key, it survives in git history
        after removal, and rotating it needs a code change and a redeploy (NIST
        SP 800-57 Part 1 Rev.5 s5.3). Quantum is irrelevant -- there is nothing
        to break. Load it from a KMS or an injected secret.
      flags: [key-material, critical]
    mode: taint
    options:
      taint_assume_safe_functions: true
      constant_propagation: false
    pattern-sources: *py-key-sources
    pattern-propagators: *py-key-propagators
    pattern-sanitizers: *py-key-sanitizers
    pattern-sinks:
      - patterns:
          - pattern: hmac.new($ARG, ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: hmac.new($ARG.encode(...), ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: hmac.HMAC($ARG, ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: hmac.HMAC($ARG.encode(...), ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: Fernet($ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: Fernet($ARG.encode(...))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: DES3.new($ARG, ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: DES3.new($ARG.encode(...), ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: algorithms.TripleDES($ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: algorithms.TripleDES($ARG.encode(...))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: algorithms.ChaCha20($ARG, ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: algorithms.ChaCha20($ARG.encode(...), ...)
          - focus-metavariable: $ARG
      # The JWT signing secret.
      - patterns:
          - pattern: jwt.encode($CLAIMS, $ARG, ...)
          - focus-metavariable: $ARG

  - id: py-hardcoded-iv
    languages: [python]
    severity: WARNING
    message: "ecdat|"
    metadata:
      algorithm: AES
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      quantum_note: >-
        A fixed IV/nonce defeats the mode it feeds. Under CBC it makes
        encryption deterministic; under CTR or GCM it is catastrophic --
        reusing a GCM nonce with the same key leaks the authentication subkey
        (NIST SP 800-38D Sec. 8.2). Classical, immediate, and unrelated to
        quantum risk.
      flags: [key-material]
    pattern-either:
      - pattern: AES.new(..., iv=b"...", ...)
      - pattern: AES.new(..., IV=b"...", ...)
      - pattern: AES.new(..., nonce=b"...", ...)
      - pattern: AES.new($K, AES.$MODE, b"...")
      - pattern: modes.CBC(b"...")
      - pattern: modes.GCM(b"...")
      - pattern: modes.CTR(b"...")

  - id: py-hardcoded-key-der
    languages: [python]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      quantum_note: >-
        A base64 DER structure embedded in source: key material by its shape.
        `MII` / `MIG` is a DER SEQUENCE with a long-form length (ITU-T X.690
        s8.1.3) -- the header of every RSA key (RFC 8017), PKCS #8 key (RFC
        5958) and X.509 certificate (RFC 5280). It is deliberately not decoded,
        because reading the DER would mean reading the key, so it may be a
        private key (CWE-321), a public key or a certificate; any of them here
        is rotated only by a code change and a redeploy.
      flags: [key-material, critical]
    options:
      # With propagation on, the literal ALSO matched at every use of its
      # constant, and one blob was reported once per use (STEP 0).
      constant_propagation: false
    patterns:
      - pattern: '"$LIT"'
      # A SEQUENCE of 128+ bytes. The short forms (Ed25519, X25519, P-256
      # SEC1) share no header distinct from base64 text that starts with "0"
      # (STEP 0), so they are left to the other branches.
      - metavariable-regex:
          metavariable: $LIT
          regex: '^MI[IG][A-Za-z0-9+/]{61,}'
      # A DER line inside a PEM block is the PEM rules'.
      - pattern-not-regex: '-----BEGIN[A-Z0-9 ]*-----[\s\S]*?-----END[A-Z0-9 ]*-----'

  - id: py-hardcoded-key-candidate
    languages: [python]
    severity: WARNING
    message: "ecdat|holder=$NAME"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      holder_metavar: $NAME
      # A string: semgrep 1.176.1 refuses a YAML float anywhere in a rule.
      confidence: "0.5"
      quantum_note: >-
        A CANDIDATE for analyst review, not an assertion: a key-ish name holding
        a high-entropy literal of 32 or more hex or base64 characters that ECDAT
        did not see reach a key parameter. It may be a key used through a helper
        or another module -- OSS taint is intra-procedural -- or an API token, a
        test vector, a digest named like a key. If it is a key, it is CWE-321
        (NIST SP 800-57 Part 1 Rev.5 s5.3): move it to a KMS or secret store.
      flags: [key-material, candidate]
    patterns:
      - pattern-either:
          - pattern: $NAME = $LITERAL
          - pattern: $NAME = $LITERAL.encode(...)
      # The name is the premise, never the proof. `iv`, `nonce`, `salt` and
      # `token` are not here: none is a secret key, and `iv` is a substring of
      # `private` and `archive`.
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|secret|passphrase|password|passwd|credential).*
      # The shape: 32+ hex/base64 characters with a digit and a letter, the
      # whole literal (str or bytes), and not a DER header.
      - metavariable-regex:
          metavariable: $LITERAL
          regex: '^[bB]?(["''])(?!MI[IG])(?=[^"'']*[0-9])(?=[^"'']*[A-Za-z])[A-Za-z0-9+/]{32,}={0,2}\1$'
      # The entropy: semgrep's analyzer rejects repeating patterns
      # (`deadbeef` x4), prose and camelCase names, and accepts random hex and
      # base64 (STEP 0).
      - metavariable-analysis:
          analyzer: entropy
          metavariable: $LITERAL
