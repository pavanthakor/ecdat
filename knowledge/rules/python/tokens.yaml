# JSON Web Tokens.
#
# Sources:
#   RFC 7518 Sec. 3.1 -- the "alg" registry (HS*, RS*, ES*, PS*, none).
#   RFC 8725 (JWT Best Current Practices) Sec. 3.1 -- reject "none"; Sec. 2.1 --
#     always pin the expected algorithm.
#   NIST IR 8547 -- the RS*/ES*/PS* families inherit RSA/ECDSA quantum exposure.
#
# One rule per algorithm family rather than one rule capturing $ALG, so that
# `algorithm` stays a canonical crypto name the CBOM can reason about while the
# literal JOSE identifier is still captured into params.alg.
rules:
  - id: py-jwt-rsa
    languages: [python]
    severity: WARNING
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: RSA
      primitive: signature
      usage: sign
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        RS*/PS* are RSA signatures (RFC 7518 Sec. 3.3, 3.5) and are broken by
        Shor. Deprecated after 2030, disallowed after 2035 (NIST IR 8547).
        Replace with ML-DSA (FIPS 204) once a JOSE registration exists; until
        then this is a track-and-plan item.
      flags: [quantum-vulnerable]
    # PROPAGATION-AWARE MATCHING (ADR-0027).
    #
    # `metavariable-pattern` is evaluated against the PROPAGATED value, so
    # `alg = "RS256"` followed by `jwt.encode(claims, key, algorithm=alg)` is caught.
    # `metavariable-regex` cannot do that: it tests the SOURCE TEXT bound to
    # the metavariable, which is the variable's NAME whenever the value was
    # assigned earlier -- so the site is silently missed while the
    # literal-at-call-site form is reported normally.
    #
    # Both branches ship; see the note in hashes.yaml for why the union is
    # kept rather than one replacing the other.
    pattern-either:
      - patterns:
          - pattern: jwt.encode(..., algorithm=$ALG, ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"RS256"'
                - pattern: '"RS384"'
                - pattern: '"RS512"'
                - pattern: '"PS256"'
                - pattern: '"PS384"'
                - pattern: '"PS512"'
      - patterns:
          - pattern: jwt.encode(..., algorithms=[$ALG], ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"RS256"'
                - pattern: '"RS384"'
                - pattern: '"RS512"'
                - pattern: '"PS256"'
                - pattern: '"PS384"'
                - pattern: '"PS512"'
      - patterns:
          - pattern: jwt.decode(..., algorithms=[$ALG], ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"RS256"'
                - pattern: '"RS384"'
                - pattern: '"RS512"'
                - pattern: '"PS256"'
                - pattern: '"PS384"'
                - pattern: '"PS512"'
      - patterns:
          - pattern: jwt.encode(..., algorithm=$ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](RS|PS)(256|384|512)["']$
      - patterns:
          - pattern: jwt.encode(..., algorithms=[$ALG], ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](RS|PS)(256|384|512)["']$
  - id: py-jwt-ecdsa
    languages: [python]
    severity: WARNING
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: ECDSA
      primitive: signature
      usage: sign
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        ES* are ECDSA signatures (RFC 7518 Sec. 3.4), broken by Shor.
        Deprecated after 2030, disallowed after 2035 (NIST IR 8547). Replace
        with ML-DSA (FIPS 204).
      flags: [quantum-vulnerable]
    # PROPAGATION-AWARE MATCHING (ADR-0027).
    #
    # `metavariable-pattern` is evaluated against the PROPAGATED value, so
    # `alg = "ES256"` followed by `jwt.encode(claims, key, algorithm=alg)` is caught.
    # `metavariable-regex` cannot do that: it tests the SOURCE TEXT bound to
    # the metavariable, which is the variable's NAME whenever the value was
    # assigned earlier -- so the site is silently missed while the
    # literal-at-call-site form is reported normally.
    #
    # Both branches ship; see the note in hashes.yaml for why the union is
    # kept rather than one replacing the other.
    pattern-either:
      - patterns:
          - pattern: jwt.encode(..., algorithm=$ALG, ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"ES256"'
                - pattern: '"ES256K"'
                - pattern: '"ES384"'
                - pattern: '"ES512"'
      - patterns:
          - pattern: jwt.encode(..., algorithms=[$ALG], ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"ES256"'
                - pattern: '"ES256K"'
                - pattern: '"ES384"'
                - pattern: '"ES512"'
      - patterns:
          - pattern: jwt.decode(..., algorithms=[$ALG], ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"ES256"'
                - pattern: '"ES256K"'
                - pattern: '"ES384"'
                - pattern: '"ES512"'
      - patterns:
          - pattern: jwt.encode(..., algorithm=$ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["']ES(256|256K|384|512)["']$
      - patterns:
          - pattern: jwt.encode(..., algorithms=[$ALG], ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["']ES(256|256K|384|512)["']$
  - id: py-jwt-hmac
    languages: [python]
    severity: INFO
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: HMAC
      primitive: mac
      usage: sign
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        HS* are HMAC-SHA-2 (RFC 7518 Sec. 3.2): symmetric, so only Grover
        applies and the margin stays adequate. The real risks are classical --
        a shared secret must be distributed to every verifier, and RFC 8725
        Sec. 2.1 warns about algorithm confusion with RS*.
      flags: [symmetric]
    # PROPAGATION-AWARE MATCHING (ADR-0027).
    #
    # `metavariable-pattern` is evaluated against the PROPAGATED value, so
    # `alg = "HS256"` followed by `jwt.encode(claims, key, algorithm=alg)` is caught.
    # `metavariable-regex` cannot do that: it tests the SOURCE TEXT bound to
    # the metavariable, which is the variable's NAME whenever the value was
    # assigned earlier -- so the site is silently missed while the
    # literal-at-call-site form is reported normally.
    #
    # Both branches ship; see the note in hashes.yaml for why the union is
    # kept rather than one replacing the other.
    pattern-either:
      - patterns:
          - pattern: jwt.encode(..., algorithm=$ALG, ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"HS256"'
                - pattern: '"HS384"'
                - pattern: '"HS512"'
      - patterns:
          - pattern: jwt.encode(..., algorithms=[$ALG], ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"HS256"'
                - pattern: '"HS384"'
                - pattern: '"HS512"'
      - patterns:
          - pattern: jwt.decode(..., algorithms=[$ALG], ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"HS256"'
                - pattern: '"HS384"'
                - pattern: '"HS512"'
      - patterns:
          - pattern: jwt.encode(..., algorithm=$ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["']HS(256|384|512)["']$
      - patterns:
          - pattern: jwt.encode(..., algorithms=[$ALG], ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["']HS(256|384|512)["']$
  - id: py-jwt-none
    languages: [python]
    severity: ERROR
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: none
      primitive: signature
      usage: sign
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        Not a cryptographic algorithm at all: "none" produces an unsigned token
        that any party can forge (RFC 7518 Sec. 3.6, RFC 8725 Sec. 3.1). This
        is a critical authentication defect, unrelated to quantum risk.
      flags: [weak, critical]
    # PROPAGATION-AWARE MATCHING (ADR-0027).
    #
    # `metavariable-pattern` is evaluated against the PROPAGATED value, so
    # `alg = "none"` followed by `jwt.encode(claims, key, algorithm=alg)` is caught.
    # `metavariable-regex` cannot do that: it tests the SOURCE TEXT bound to
    # the metavariable, which is the variable's NAME whenever the value was
    # assigned earlier -- so the site is silently missed while the
    # literal-at-call-site form is reported normally.
    #
    # Both branches ship; see the note in hashes.yaml for why the union is
    # kept rather than one replacing the other.
    pattern-either:
      - patterns:
          - pattern: jwt.encode(..., algorithm=$ALG, ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"none"'
                - pattern: '"None"'
                - pattern: '"NONE"'
      - patterns:
          - pattern: jwt.encode(..., algorithms=[$ALG], ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"none"'
                - pattern: '"None"'
                - pattern: '"NONE"'
      - patterns:
          - pattern: jwt.decode(..., algorithms=[$ALG], ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"none"'
                - pattern: '"None"'
                - pattern: '"NONE"'
      - patterns:
          - pattern: jwt.encode(..., algorithm=$ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](?i:none)["']$
      - patterns:
          - pattern: jwt.encode(..., algorithms=[$ALG], ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](?i:none)["']$
