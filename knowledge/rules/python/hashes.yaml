# Hash functions.
#
# Sources:
#   MD5      -- RFC 6151 (collision attacks, MUST NOT for signatures);
#               NIST SP 800-131A Rev.2 Table 8 (disallowed for digital signatures).
#   SHA-1    -- NIST SP 800-131A Rev.2 (disallowed for digital signature
#               generation since 2013); NIST IR 8696 / NIST policy statement of
#               2022-12-15 retiring SHA-1 by 2030.
#   SHA-2    -- FIPS 180-4. Approved. Grover halves the preimage margin only,
#               so SHA-256 keeps a 128-bit quantum preimage margin.
rules:
  - id: py-hashlib-md5
    languages: [python]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: MD5
      primitive: hash
      usage: hash
      asset_type: algorithm
      quantum_note: >-
        Already classically broken (RFC 6151): collisions are trivial. Quantum
        computing does not change the verdict -- this is a today problem, not a
        2030 problem. Replace with SHA-256 or SHA-3.
      flags: [weak]
    pattern-either:
      - pattern: hashlib.md5(...)
      - patterns:
          - pattern: hashlib.new($ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](?i:md5)["']$

  - id: py-hashlib-sha1
    languages: [python]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: SHA-1
      primitive: hash
      usage: hash
      asset_type: algorithm
      quantum_note: >-
        Classically broken for collision resistance (SHAttered, 2017) and
        disallowed for signature generation by NIST SP 800-131A Rev.2. Grover is
        irrelevant next to the classical break. Replace with SHA-256.
      flags: [weak]
    pattern-either:
      - pattern: hashlib.sha1(...)
      - patterns:
          - pattern: hashlib.new($ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](?i:sha1|sha-1)["']$

  - id: py-hashlib-sha256
    languages: [python]
    severity: INFO
    message: "ecdat|"
    metadata:
      algorithm: SHA-256
      primitive: hash
      usage: hash
      asset_type: algorithm
      quantum_note: >-
        FIPS 180-4 approved. Grover reduces preimage resistance from 256 to
        ~128 bits, which remains adequate; NIST requires no migration. Detected
        as a control so the inventory shows what is already correct.
      flags: [control]
    pattern-either:
      - pattern: hashlib.sha256(...)
      - patterns:
          - pattern: hashlib.new($ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](?i:sha256|sha-256)["']$

  - id: py-hashlib-sha384
    languages: [python]
    severity: INFO
    message: "ecdat|"
    metadata:
      algorithm: SHA-384
      primitive: hash
      usage: hash
      asset_type: algorithm
      quantum_note: >-
        FIPS 180-4 approved; CNSA 2.0 requires SHA-384 or better for national
        security systems. No migration required.
      flags: [control]
    pattern-either:
      - pattern: hashlib.sha384(...)
      - patterns:
          - pattern: hashlib.new($ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](?i:sha384|sha-384)["']$

  - id: py-hashlib-sha512
    languages: [python]
    severity: INFO
    message: "ecdat|"
    metadata:
      algorithm: SHA-512
      primitive: hash
      usage: hash
      asset_type: algorithm
      quantum_note: >-
        FIPS 180-4 approved. No migration required.
      flags: [control]
    pattern-either:
      - pattern: hashlib.sha512(...)
      - patterns:
          - pattern: hashlib.new($ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](?i:sha512|sha-512)["']$
