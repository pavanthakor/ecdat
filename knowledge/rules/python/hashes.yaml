# Hash functions.
#
# Sources:
#   MD5      -- RFC 6151 (collision attacks, MUST NOT for signatures);
#               NIST SP 800-131A Rev.2 Table 8 (disallowed for digital signatures).
#   SHA-1    -- NIST SP 800-131A Rev.2 (disallowed for digital signature
#               generation since 2013); NIST IR 8696 / NIST policy statement of
#               2022-12-15 retiring SHA-1 by 2030.
#   SHA-2    -- FIPS 180-4. Approved. Grover halves the preimage margin only,
#               so SHA-256 keeps a 128-bit quantum preimage margin.
rules:
  - id: py-hashlib-md5
    languages: [python]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: MD5
      primitive: hash
      usage: hash
      asset_type: algorithm
      quantum_note: >-
        Already classically broken (RFC 6151): collisions are trivial. Quantum
        computing does not change the verdict -- this is a today problem, not a
        2030 problem. Replace with SHA-256 or SHA-3.
      flags: [weak]
    # PROPAGATION-AWARE MATCHING (ADR-0027).
    #
    # `metavariable-pattern` is evaluated against the PROPAGATED value, so
    # `algo = "md5"` followed by `hashlib.new(algo, ...)` is caught.
    # `metavariable-regex` cannot do that: it tests the SOURCE TEXT bound to
    # the metavariable, which is the variable's NAME whenever the value was
    # assigned earlier -- so the site is silently missed while the
    # literal-at-call-site form is reported normally.
    #
    # Both branches ship. The metavariable-pattern branch enumerates spellings;
    # the metavariable-regex branch is case-insensitive and does not. The union
    # is wider than either, and the two agree on every identifying field, so a
    # site matching both carries ONE identity and the normaliser folds it.
    pattern-either:
      - pattern: hashlib.md5(...)
      - patterns:
          - pattern: hashlib.new($ALG, ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"md5"'
                - pattern: '"MD5"'
      - patterns:
          - pattern: hashlib.new($ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](?i:md5)["']$
  - id: py-hashlib-sha1
    languages: [python]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: SHA-1
      primitive: hash
      usage: hash
      asset_type: algorithm
      quantum_note: >-
        Classically broken for collision resistance (SHAttered, 2017) and
        disallowed for signature generation by NIST SP 800-131A Rev.2. Grover is
        irrelevant next to the classical break. Replace with SHA-256.
      flags: [weak]
    # PROPAGATION-AWARE MATCHING (ADR-0027).
    #
    # `metavariable-pattern` is evaluated against the PROPAGATED value, so
    # `algo = "sha1"` followed by `hashlib.new(algo, ...)` is caught.
    # `metavariable-regex` cannot do that: it tests the SOURCE TEXT bound to
    # the metavariable, which is the variable's NAME whenever the value was
    # assigned earlier -- so the site is silently missed while the
    # literal-at-call-site form is reported normally.
    #
    # Both branches ship. The metavariable-pattern branch enumerates spellings;
    # the metavariable-regex branch is case-insensitive and does not. The union
    # is wider than either, and the two agree on every identifying field, so a
    # site matching both carries ONE identity and the normaliser folds it.
    pattern-either:
      - pattern: hashlib.sha1(...)
      - patterns:
          - pattern: hashlib.new($ALG, ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"sha1"'
                - pattern: '"SHA1"'
                - pattern: '"sha-1"'
                - pattern: '"SHA-1"'
      - patterns:
          - pattern: hashlib.new($ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](?i:sha1)["']$
  - id: py-hashlib-sha256
    languages: [python]
    severity: INFO
    message: "ecdat|"
    metadata:
      algorithm: SHA-256
      primitive: hash
      usage: hash
      asset_type: algorithm
      quantum_note: >-
        FIPS 180-4 approved. Grover reduces preimage resistance from 256 to
        ~128 bits, which remains adequate; NIST requires no migration. Detected
        as a control so the inventory shows what is already correct.
      flags: [control]
    # PROPAGATION-AWARE MATCHING (ADR-0027).
    #
    # `metavariable-pattern` is evaluated against the PROPAGATED value, so
    # `algo = "sha256"` followed by `hashlib.new(algo, ...)` is caught.
    # `metavariable-regex` cannot do that: it tests the SOURCE TEXT bound to
    # the metavariable, which is the variable's NAME whenever the value was
    # assigned earlier -- so the site is silently missed while the
    # literal-at-call-site form is reported normally.
    #
    # Both branches ship. The metavariable-pattern branch enumerates spellings;
    # the metavariable-regex branch is case-insensitive and does not. The union
    # is wider than either, and the two agree on every identifying field, so a
    # site matching both carries ONE identity and the normaliser folds it.
    pattern-either:
      - pattern: hashlib.sha256(...)
      - patterns:
          - pattern: hashlib.new($ALG, ...)
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"sha256"'
                - pattern: '"SHA256"'
                - pattern: '"sha-256"'
                - pattern: '"SHA-256"'
      - patterns:
          - pattern: hashlib.new($ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](?i:sha256)["']$
