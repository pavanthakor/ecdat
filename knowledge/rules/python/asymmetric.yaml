# Public-key cryptography -- the Shor-broken family.
#
# Sources:
#   NIST IR 8547 (initial public draft, Nov 2024) -- RSA, ECDSA, ECDH, DH and
#     EdDSA are deprecated after 2030 and disallowed after 2035.
#   FIPS 203 (ML-KEM), FIPS 204 (ML-DSA), FIPS 205 (SLH-DSA), Aug 2024 -- the
#     approved replacements.
#   NIST SP 800-56A Rev.3 -- ECDH key agreement.
#   Meta Directive on National Deep Tech / DST India quantum roadmap -- national
#     deadlines are applied by the policy engine, not by this pack.
#
# usage=unknown at key generation is deliberate. A generated RSA key may end up
# signing or transporting, and the correct PQC replacement differs (ML-DSA vs
# ML-KEM). The correlator refines usage from the use site; guessing here would
# manufacture a wrong recommendation. See ADR-0004.
rules:
  - id: py-rsa-keygen
    languages: [python]
    severity: WARNING
    message: "ecdat|key_size=$KEYSIZE"
    metadata:
      algorithm: RSA
      primitive: pke
      usage: unknown
      asset_type: algorithm
      keysize_metavar: $KEYSIZE
      quantum_note: >-
        Broken outright by Shor's algorithm; key size does not help -- RSA-4096
        falls to the same attack as RSA-2048. Deprecated after 2030 and
        disallowed after 2035 (NIST IR 8547). Replacement depends on usage:
        ML-KEM (FIPS 203) for key transport, ML-DSA (FIPS 204) for signatures.
      flags: [quantum-vulnerable]
    pattern-either:
      - pattern: rsa.generate_private_key(..., key_size=$KEYSIZE, ...)
      - pattern: RSA.generate($KEYSIZE, ...)
      - pattern: RSA.generate(bits=$KEYSIZE, ...)

  - id: py-ec-keygen
    languages: [python]
    severity: WARNING
    message: "ecdat|curve=$CURVE"
    metadata:
      algorithm: ECDH
      primitive: key-agreement
      usage: unknown
      asset_type: algorithm
      capture:
        curve: $CURVE
      quantum_note: >-
        Elliptic-curve discrete log is broken by Shor; a 256-bit curve needs
        fewer logical qubits than RSA-2048, so EC falls first. Deprecated after
        2030, disallowed after 2035 (NIST IR 8547). Replace key agreement with
        ML-KEM (FIPS 203), or a hybrid X25519+ML-KEM during transition.
      flags: [quantum-vulnerable]
    pattern-either:
      - pattern: ec.generate_private_key($CURVE, ...)
      - pattern: ec.generate_private_key(curve=$CURVE, ...)
      - pattern: ECC.generate(curve=$CURVE, ...)

  - id: py-ed25519-sign
    languages: [python]
    severity: WARNING
    message: "ecdat|"
    metadata:
      algorithm: Ed25519
      primitive: signature
      usage: sign
      asset_type: algorithm
      quantum_note: >-
        EdDSA over Curve25519. Classically strong, but the discrete log it
        rests on is broken by Shor. Deprecated after 2030, disallowed after
        2035 (NIST IR 8547). Replace with ML-DSA (FIPS 204) or SLH-DSA
        (FIPS 205) where a conservative hash-based signature is preferred.
      flags: [quantum-vulnerable]
    pattern-either:
      - pattern: ed25519.Ed25519PrivateKey.generate()
      - pattern: ed25519.Ed25519PrivateKey.from_private_bytes(...)
      - pattern: Ed25519PrivateKey.generate()

  - id: py-ecdsa-sign
    languages: [python]
    severity: WARNING
    message: "ecdat|"
    metadata:
      algorithm: ECDSA
      primitive: signature
      usage: sign
      asset_type: algorithm
      quantum_note: >-
        FIPS 186-5 approved today, broken by Shor tomorrow. Deprecated after
        2030, disallowed after 2035 (NIST IR 8547). Replace with ML-DSA
        (FIPS 204).
      flags: [quantum-vulnerable]
    pattern-either:
      - pattern: ec.ECDSA(...)
      - pattern: ECDSA(...)
