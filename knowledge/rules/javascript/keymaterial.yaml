# Key material embedded in JavaScript / TypeScript source.
#
# Sources:
#   NIST SP 800-57 Part 1 Rev.5 s5.3 -- key material must be protected for its
#     whole lifetime; a key in source control has no lifetime bound at all.
#   NIST SP 800-133 Rev.2 -- keys must come from an approved RBG, not a literal.
#   CWE-321 (hard-coded cryptographic key), CWE-798 (hard-coded credentials).
#   RFC 7468 -- textual encodings of PKIX/PKCS structures (the PEM banners).
#
# A hard-coded key in JavaScript is worse than in a server language, because
# anything bundled for a browser ships the key to every visitor.
#
# BOTH rules set `redact: true`, so the snippet becomes
# `<redacted key material>` before it reaches a Finding. `redact` does NOT
# sanitise the message, so neither rule interpolates the metavariable that
# binds to the secret -- `message: "ecdat|"` and nothing else. A planted
# sentinel proves it holds:
# tests/test_rules_js.py::test_no_planted_secret_reaches_any_js_finding.
rules:
  - id: js-hardcoded-key
    languages: [javascript, typescript]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      quantum_note: >-
        A key or IV written as a literal in source. Everyone with repository
        access has the key, it survives in git history after removal, and
        rotating it needs a code change and a redeploy (CWE-321; NIST SP 800-57
        Part 1 Rev.5 s5.3). In a bundled front end it is served to every
        visitor. Quantum is irrelevant -- there is nothing to break. Load it
        from a KMS or secret store, generated by `crypto.randomBytes`
        (NIST SP 800-133 Rev.2).
      flags: [key-material, critical]
    patterns:
      - pattern-either:
          - pattern: const $NAME = $LITERAL;
          - pattern: let $NAME = $LITERAL;
          - pattern: var $NAME = $LITERAL;
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|secret|iv|nonce|salt|passphrase|password|credential).*
      # Anchored at the start (semgrep uses Python `re.match`) and the bound
      # content includes the quote, so both styles are listed. Eight characters
      # is a DES key -- the shortest literal worth treating as key material.
      - metavariable-regex:
          metavariable: $LITERAL
          regex: ^["'][^"']{8,}["']$

  - id: js-pem-block
    languages: [javascript, typescript]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: certificate
      redact: true
      quantum_note: >-
        A PEM block embedded in source (RFC 7468). ECDAT records that key
        material or a certificate is present and where, and deliberately does
        not parse it: the algorithm and key size would mean reading the DER,
        and the point of this rule is that the bytes must not reach the CBOM at
        all. A private key here is CWE-321; a certificate here cannot be
        rotated without a redeploy.
      flags: [key-material, critical]
    patterns:
      - pattern-regex: -----BEGIN[A-Z0-9 ]*-----
