# Key material embedded in JavaScript / TypeScript source.
#
# Sources:
#   NIST SP 800-57 Part 1 Rev.5 s5.3 -- key material must be protected for its
#     whole lifetime; a key in source control has no lifetime bound at all.
#   NIST SP 800-133 Rev.2 -- keys must come from an approved RBG, not a literal.
#   CWE-321 (hard-coded cryptographic key), CWE-798 (hard-coded credentials).
#   RFC 7468 -- textual encodings of PKIX/PKCS structures (the PEM banners).
#   ITU-T X.690 s8.1.3 -- DER length octets: the `MII` / `MIG` header shape.
#   Node.js crypto -- createCipheriv/createDecipheriv(algorithm, key, iv),
#     createHmac(algorithm, key), createSecretKey(key); jsonwebtoken --
#     sign(payload, secretOrPrivateKey). The key parameters the sink rule knows.
#
# A hard-coded key in JavaScript is worse than in a server language, because
# anything bundled for a browser ships the key to every visitor.
#
# CORROBORATION, NOT A NAME (ADR-0034). Until ADR-0034 `js-hardcoded-key` fired
# on any key-ish NAME holding a literal; on OWASP Juice Shop that reported five
# Angular storage, cookie and config strings as key material. A name is not
# evidence. A literal is reported only when something corroborates it:
#
#   js-pem-block                a PEM block                    confidence 1.0
#   js-hardcoded-key-der        a base64 DER structure         confidence 1.0
#   js-hardcoded-key            it reaches a key, IV, HMAC     confidence 1.0
#                               or signing parameter
#   js-hardcoded-key-candidate  a key-ish name, a high-        confidence 0.5,
#                               entropy 32+ character          marked `candidate`
#                               literal, and nothing else
#
# A key-ish name holding anything else -- a storage key, a cookie name, a
# header, a config constant -- does not fire. testdata/juiceshop_mirror is the
# acceptance test; must_not_fire/ts_plain_key_strings.ts is the same class in
# this pack's own tree.
#
# REDACTION. Every rule sets `redact: true`, so the snippet becomes
# `<redacted key material>`. `redact` does NOT sanitise the message, so no rule
# interpolates a metavariable that can bind to the secret. The sink rule and the
# candidate carry only `holder=` -- the IDENTIFIER the literal was declared
# under, never the literal -- which the scanner keeps out of params and discards
# unless it is identifier-shaped. No metavariable here is a prefix of `$HOLDER`
# or `$NAME`: semgrep substitutes a bound metavariable into any longer, UNBOUND
# name it prefixes (measured, ADR-0034 STEP 0), so a `$H` bound beside an
# unbound `$HOLDER` would write `$H`'s value into the Finding.
rules:
  - id: js-hardcoded-key
    languages: [javascript, typescript]
    severity: ERROR
    message: "ecdat|holder=$HOLDER"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      holder_metavar: $HOLDER
      quantum_note: >-
        A literal that reaches a key, IV, HMAC-key or signing-secret parameter:
        hard-coded key material, corroborated by where it goes rather than by
        what it is called. Everyone with repository access has the key, it
        survives in git history after removal, and rotating it needs a code
        change and a redeploy (CWE-321; NIST SP 800-57 Part 1 Rev.5 s5.3). In a
        bundled front end it is served to every visitor. Quantum is irrelevant
        -- there is nothing to break. Load it from a KMS or secret store,
        generated by `crypto.randomBytes` (NIST SP 800-133 Rev.2).
      flags: [key-material, critical]
    mode: taint
    options:
      # A call's result is not its arguments. Without this, a KDF salt
      # (`scryptSync(pw, "salt", 32)`) flowed through the call into the key
      # parameter and was reported as the key (STEP 0). The encoding wrapper
      # is re-admitted below, as a propagator and as sink shapes.
      taint_assume_safe_functions: true
      # With propagation on, a constant-backed argument ALSO matched the
      # literal source at its use, and every such key was reported twice.
      constant_propagation: false
    pattern-sources:
      # A literal that initialises a named holder -- a const, let or var, a
      # class field, an assignment. The holder travels to the message.
      - patterns:
          - pattern-either:
              - pattern-inside: const $HOLDER = "...";
              - pattern-inside: let $HOLDER = "...";
              - pattern-inside: var $HOLDER = "...";
              - pattern-inside: $HOLDER = "...";
          - pattern: '"$LIT"'
          # Eight characters or more -- a DES key, the shortest worth
          # protecting -- and never a PEM or DER literal: js-pem-block and
          # js-hardcoded-key-der own a SHAPED literal, so it is reported once.
          - metavariable-regex:
              metavariable: $LIT
              regex: '^(?![\s\S]*-----(?:BEGIN|END))(?!MI[IG][A-Za-z0-9+/]{61})[\s\S]{8,}$'
      # A literal written anywhere else -- inline at the sink -- holds nothing.
      - patterns:
          - pattern: '"$LIT"'
          - pattern-not-inside: const $VARNAME = "...";
          - pattern-not-inside: let $VARNAME = "...";
          - pattern-not-inside: var $VARNAME = "...";
          - pattern-not-inside: $VARNAME = "...";
          - metavariable-regex:
              metavariable: $LIT
              regex: '^(?![\s\S]*-----(?:BEGIN|END))(?!MI[IG][A-Za-z0-9+/]{61})[\s\S]{8,}$'
    pattern-propagators:
      - pattern: $TO = Buffer.from($FROM, ...)
        from: $FROM
        to: $TO
    pattern-sanitizers:
      # An ASSEMBLED key -- a constant joined to a runtime value -- is not a
      # hard-coded key: the literal is a part of it. This is also what stops a
      # PEM split across `+` leaking through its unbannered middle lines.
      - pattern: $LEFT + $RIGHT
    # One sink per shape. Two shapes that match the SAME call must not share a
    # pattern-either: semgrep keeps one binding per range, and the Buffer.from
    # see-through lost to the plain form (STEP 0).
    pattern-sinks:
      # The cipher key.
      - patterns:
          - pattern: crypto.createCipheriv($ALG, $ARG, ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: crypto.createCipheriv($ALG, Buffer.from($ARG, ...), ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: crypto.createDecipheriv($ALG, $ARG, ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: crypto.createDecipheriv($ALG, Buffer.from($ARG, ...), ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: createCipheriv($ALG, $ARG, ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: createDecipheriv($ALG, $ARG, ...)
          - focus-metavariable: $ARG
      # The IV.
      - patterns:
          - pattern: crypto.createCipheriv($ALG, $OTHERKEY, $ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: crypto.createCipheriv($ALG, $OTHERKEY, Buffer.from($ARG, ...))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: crypto.createDecipheriv($ALG, $OTHERKEY, $ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: crypto.createDecipheriv($ALG, $OTHERKEY, Buffer.from($ARG, ...))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: createCipheriv($ALG, $OTHERKEY, $ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: createDecipheriv($ALG, $OTHERKEY, $ARG)
          - focus-metavariable: $ARG
      # The HMAC key, and a raw secret key.
      - patterns:
          - pattern: crypto.createHmac($ALG, $ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: crypto.createHmac($ALG, Buffer.from($ARG, ...))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: createHmac($ALG, $ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: crypto.createSecretKey($ARG, ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: crypto.createSecretKey(Buffer.from($ARG, ...), ...)
          - focus-metavariable: $ARG
      # The JWT signing secret.
      - patterns:
          - pattern: jwt.sign($CLAIMS, $ARG, ...)
          - focus-metavariable: $ARG

  - id: js-hardcoded-key-der
    languages: [javascript, typescript]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      quantum_note: >-
        A base64 DER structure embedded in source: key material by its shape.
        `MII` / `MIG` is a DER SEQUENCE with a long-form length (ITU-T X.690
        s8.1.3) -- the header of every RSA key (RFC 8017), PKCS #8 key (RFC
        5958) and X.509 certificate (RFC 5280). It is deliberately not decoded,
        because reading the DER would mean reading the key, so it may be a
        private key (CWE-321), a public key or a certificate; any of them here
        is rotated only by a code change and a redeploy.
      flags: [key-material, critical]
    options:
      # With propagation on, the literal ALSO matched at every use of its
      # constant, and one blob was reported once per use (STEP 0).
      constant_propagation: false
    patterns:
      - pattern: '"$LIT"'
      # A SEQUENCE of 128+ bytes. The short forms (Ed25519, X25519, P-256
      # SEC1) share no header distinct from base64 text that starts with "0"
      # (STEP 0), so they are left to the other branches.
      - metavariable-regex:
          metavariable: $LIT
          regex: '^MI[IG][A-Za-z0-9+/]{61,}'
      # A DER line inside a PEM block is js-pem-block's.
      - pattern-not-regex: '-----BEGIN[A-Z0-9 ]*-----[\s\S]*?-----END[A-Z0-9 ]*-----'

  - id: js-hardcoded-key-candidate
    languages: [javascript, typescript]
    severity: WARNING
    message: "ecdat|holder=$NAME"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      holder_metavar: $NAME
      # A string: semgrep 1.176.1 refuses a YAML float anywhere in a rule.
      confidence: "0.5"
      quantum_note: >-
        A CANDIDATE for analyst review, not an assertion: a key-ish name holding
        a high-entropy literal of 32 or more hex or base64 characters that ECDAT
        did not see reach a key parameter. It may be a key used through a helper
        or another module -- OSS taint is intra-procedural -- or an API token, a
        test vector, a digest named like a key. If it is a key, it is CWE-321
        (NIST SP 800-57 Part 1 Rev.5 s5.3): move it to a KMS or secret store.
      flags: [key-material, candidate]
    patterns:
      # A class field matches these too: semgrep reads a TypeScript field
      # initialiser as a declaration (STEP 0).
      - pattern-either:
          - pattern: const $NAME = $LITERAL;
          - pattern: let $NAME = $LITERAL;
          - pattern: var $NAME = $LITERAL;
      # The name is the premise, never the proof. `iv`, `nonce` and `salt` are
      # not here -- none is a secret, and `iv` is a substring of `private` and
      # `archive` -- and neither is `token`: in the real Juice Shop scan a
      # `...TokenAddress` held a blockchain address.
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|secret|passphrase|password|passwd|credential).*
      # The shape: 32+ hex/base64 characters with a digit and a letter, the
      # whole literal, and not a DER header (js-hardcoded-key-der owns that).
      - metavariable-regex:
          metavariable: $LITERAL
          regex: '^(["''`])(?!MI[IG])(?=[^"''`]*[0-9])(?=[^"''`]*[A-Za-z])[A-Za-z0-9+/]{32,}={0,2}\1$'
      # The entropy: semgrep's analyzer rejected every Juice Shop false
      # positive, repeating patterns (`deadbeef` x4), prose, URLs and camelCase
      # names, and accepted random hex and base64 (STEP 0).
      - metavariable-analysis:
          analyzer: entropy
          metavariable: $LITERAL

  - id: js-pem-block
    languages: [javascript, typescript]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: certificate
      redact: true
      quantum_note: >-
        A PEM block embedded in source (RFC 7468). ECDAT records that key
        material or a certificate is present and where, and deliberately does
        not parse it: the algorithm and key size would mean reading the DER,
        and the point of this rule is that the bytes must not reach the CBOM at
        all. A private key here is CWE-321; a certificate here cannot be
        rotated without a redeploy.
      flags: [key-material, critical]
    patterns:
      - pattern-regex: -----BEGIN[A-Z0-9 ]*-----
