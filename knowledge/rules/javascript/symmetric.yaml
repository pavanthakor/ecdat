# JavaScript / TypeScript symmetric ciphers.
#
# Sources:
#   AES      -- FIPS 197. Grover halves the effective key strength, so AES-128
#               retains ~64-bit security against a quantum adversary and
#               AES-256 ~128; CNSA 2.0 requires AES-256 for long-lived data.
#   CBC      -- NIST SP 800-38A; unauthenticated and padding-oracle prone
#               (Vaudenay 2002) unless paired with a MAC.
#   GCM      -- NIST SP 800-38D (authenticated encryption).
#   ECB      -- NIST SP 800-38A Appendix A: identical plaintext blocks produce
#               identical ciphertext blocks.
#   DES/3DES -- NIST SP 800-131A Rev.2 (3DES disallowed after 2023);
#               Sweet32, CVE-2016-2183.
#   Node.js `crypto.createCipheriv` (nodejs.org/api/crypto.html); node-forge
#     `forge.cipher.createCipher` (github.com/digitalbazaar/forge).
#
# THE WHOLE SUITE STRING IS CAPTURED, as `cipher_suite`. In Node the algorithm,
# key size and mode are one token -- `aes-256-gcm` says all three -- and
# splitting it inside the rule would discard what the source actually said. The
# rule reports the token verbatim; the policy engine reads it.
rules:
  - id: js-createcipheriv
    languages: [javascript, typescript]
    severity: WARNING
    message: "ecdat|cipher_suite=$SUITE"
    metadata:
      algorithm: AES
      primitive: block-cipher
      usage: encrypt
      asset_type: algorithm
      capture:
        cipher_suite: $SUITE
      quantum_note: >-
        AES (FIPS 197) survives quantum: Grover halves the effective key
        strength, so AES-256 keeps ~128-bit security and is what CNSA 2.0
        requires for data that must stay confidential past 2035. The MODE is
        the classical question -- `-cbc` is unauthenticated and padding-oracle
        prone (NIST SP 800-38A; Vaudenay 2002), `-ecb` leaks plaintext
        structure (SP 800-38A Appendix A), and `-gcm` is the AEAD to prefer
        (SP 800-38D). The captured suite carries key size and mode together,
        which is how Node spells them.
      flags: [symmetric]
    # PROPAGATION-AWARE MATCHING (ADR-0028).
    #
    # `metavariable-pattern` is evaluated against the PROPAGATED value, so
    # `const suite = "aes-256-gcm"` followed by the call below is caught.
    # `metavariable-regex` cannot: it tests the SOURCE TEXT bound to the
    # metavariable, which is the variable's NAME whenever the value was
    # assigned earlier. For the JWT rules that hole was an AUTHENTICATION
    # BYPASS -- `const alg = "none"` produced no finding at all, and RFC 8725
    # s3.1 requires `alg: none` to be rejected outright.
    #
    # Both branches ship; the union is wider than either, and the two agree on
    # every identifying field so a site matching both carries ONE identity.
    pattern-either:
      - patterns:
          - pattern: crypto.createCipheriv($SUITE, ...)
          - metavariable-pattern:
              metavariable: $SUITE
              pattern-either:
                - pattern: '"aes-128-cbc"'
                - pattern: '"aes-192-cbc"'
                - pattern: '"aes-256-cbc"'
                - pattern: '"aes-128-gcm"'
                - pattern: '"aes-192-gcm"'
                - pattern: '"aes-256-gcm"'
                - pattern: '"aes-128-ecb"'
                - pattern: '"aes-192-ecb"'
                - pattern: '"aes-256-ecb"'
                - pattern: '"aes-128-ctr"'
                - pattern: '"aes-256-ctr"'
                - pattern: '"aes-128-ccm"'
                - pattern: '"aes-256-ccm"'
      - patterns:
          - pattern: crypto.createDecipheriv($SUITE, ...)
          - metavariable-pattern:
              metavariable: $SUITE
              pattern-either:
                - pattern: '"aes-128-cbc"'
                - pattern: '"aes-192-cbc"'
                - pattern: '"aes-256-cbc"'
                - pattern: '"aes-128-gcm"'
                - pattern: '"aes-192-gcm"'
                - pattern: '"aes-256-gcm"'
                - pattern: '"aes-128-ecb"'
                - pattern: '"aes-192-ecb"'
                - pattern: '"aes-256-ecb"'
                - pattern: '"aes-128-ctr"'
                - pattern: '"aes-256-ctr"'
                - pattern: '"aes-128-ccm"'
                - pattern: '"aes-256-ccm"'
      - patterns:
          - pattern: createCipheriv($SUITE, ...)
          - metavariable-pattern:
              metavariable: $SUITE
              pattern-either:
                - pattern: '"aes-128-cbc"'
                - pattern: '"aes-192-cbc"'
                - pattern: '"aes-256-cbc"'
                - pattern: '"aes-128-gcm"'
                - pattern: '"aes-192-gcm"'
                - pattern: '"aes-256-gcm"'
                - pattern: '"aes-128-ecb"'
                - pattern: '"aes-192-ecb"'
                - pattern: '"aes-256-ecb"'
                - pattern: '"aes-128-ctr"'
                - pattern: '"aes-256-ctr"'
                - pattern: '"aes-128-ccm"'
                - pattern: '"aes-256-ccm"'
      - patterns:
          - pattern: createDecipheriv($SUITE, ...)
          - metavariable-pattern:
              metavariable: $SUITE
              pattern-either:
                - pattern: '"aes-128-cbc"'
                - pattern: '"aes-192-cbc"'
                - pattern: '"aes-256-cbc"'
                - pattern: '"aes-128-gcm"'
                - pattern: '"aes-192-gcm"'
                - pattern: '"aes-256-gcm"'
                - pattern: '"aes-128-ecb"'
                - pattern: '"aes-192-ecb"'
                - pattern: '"aes-256-ecb"'
                - pattern: '"aes-128-ctr"'
                - pattern: '"aes-256-ctr"'
                - pattern: '"aes-128-ccm"'
                - pattern: '"aes-256-ccm"'
      - patterns:
          - pattern: crypto.createCipheriv($SUITE, ...)
          - metavariable-regex:
              metavariable: $SUITE
              regex: ^["']aes-
      - patterns:
          - pattern: crypto.createDecipheriv($SUITE, ...)
          - metavariable-regex:
              metavariable: $SUITE
              regex: ^["']aes-
      - patterns:
          - pattern: createCipheriv($SUITE, ...)
          - metavariable-regex:
              metavariable: $SUITE
              regex: ^["']aes-
      - patterns:
          - pattern: createDecipheriv($SUITE, ...)
          - metavariable-regex:
              metavariable: $SUITE
              regex: ^["']aes-
  - id: js-forge-legacy-cipher
    languages: [javascript, typescript]
    severity: ERROR
    message: "ecdat|cipher_suite=$SUITE"
    metadata:
      algorithm: 3DES
      primitive: block-cipher
      usage: encrypt
      asset_type: algorithm
      capture:
        cipher_suite: $SUITE
      quantum_note: >-
        node-forge ships DES, 3DES and RC2 alongside AES. 3DES is disallowed
        after 2023 (NIST SP 800-131A Rev.2) and its 64-bit block makes Sweet32
        (CVE-2016-2183) practical on long-lived connections; single DES has
        been brute-forceable since 1998 (EFF Deep Crack); RC2 has no modern
        standing. None of these is a quantum problem -- they are already
        broken. Replace with AES-256-GCM (FIPS 197 with NIST SP 800-38D).
      flags: [weak, symmetric, critical]
    # PROPAGATION-AWARE MATCHING (ADR-0028).
    #
    # `metavariable-pattern` is evaluated against the PROPAGATED value, so
    # `const suite = "3DES-CBC"` followed by the call below is caught.
    # `metavariable-regex` cannot: it tests the SOURCE TEXT bound to the
    # metavariable, which is the variable's NAME whenever the value was
    # assigned earlier. For the JWT rules that hole was an AUTHENTICATION
    # BYPASS -- `const alg = "none"` produced no finding at all, and RFC 8725
    # s3.1 requires `alg: none` to be rejected outright.
    #
    # Both branches ship; the union is wider than either, and the two agree on
    # every identifying field so a site matching both carries ONE identity.
    pattern-either:
      - patterns:
          - pattern: forge.cipher.createCipher($SUITE, ...)
          - metavariable-pattern:
              metavariable: $SUITE
              pattern-either:
                - pattern: '"3DES-CBC"'
                - pattern: '"3DES-ECB"'
                - pattern: '"DES-CBC"'
                - pattern: '"DES-ECB"'
                - pattern: '"RC2-CBC"'
      - patterns:
          - pattern: forge.cipher.createDecipher($SUITE, ...)
          - metavariable-pattern:
              metavariable: $SUITE
              pattern-either:
                - pattern: '"3DES-CBC"'
                - pattern: '"3DES-ECB"'
                - pattern: '"DES-CBC"'
                - pattern: '"DES-ECB"'
                - pattern: '"RC2-CBC"'
      - patterns:
          - pattern: forge.cipher.createCipher($SUITE, ...)
          - metavariable-regex:
              metavariable: $SUITE
              regex: ^["'](3DES|DES|RC2)
      - patterns:
          - pattern: forge.cipher.createDecipher($SUITE, ...)
          - metavariable-regex:
              metavariable: $SUITE
              regex: ^["'](3DES|DES|RC2)
