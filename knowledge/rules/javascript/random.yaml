# Randomness in JavaScript / TypeScript.
#
# Sources:
#   NIST SP 800-90A Rev.1 -- approved DRBG constructions.
#   NIST SP 800-133 Rev.2 -- key generation requires an approved RBG.
#   ECMA-262 s21.4.2.28 -- `Math.random` explicitly provides no cryptographic
#     guarantee; implementations use xorshift128+ or similar.
#   Node.js `crypto.randomBytes` / WebCrypto `crypto.getRandomValues` are the
#     CSPRNGs (nodejs.org/api/crypto.html).
#
# NAME-SCOPED, exactly like the Python and Go weak-RNG rules. `Math.random` is
# entirely legitimate for jitter, sampling, shuffling a display list or picking
# a banner, and a rule that fired on every use would be noise an operator
# learns to ignore. It fires only where the value is bound to a name that reads
# like a key, token, secret or nonce -- a heuristic, which is why the decoy
# files plant a `jitter`, a display shuffle and a banner pick that must NOT
# fire, in both `.js` and `.ts`.
rules:
  - id: js-math-random
    languages: [javascript, typescript]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: Math.random
      primitive: drbg
      usage: unknown
      asset_type: algorithm
      quantum_note: >-
        `Math.random` is a non-cryptographic PRNG; ECMA-262 s21.4.2.28 states
        it carries no security guarantee, and V8 implements it with
        xorshift128+. An attacker who observes a few outputs recovers the
        internal state and predicts every subsequent value, so a key or token
        drawn from it is recoverable TODAY -- no quantum computer required.
        NIST SP 800-133 Rev.2 requires an approved RBG (SP 800-90A Rev.1) for
        key generation. Use `crypto.randomBytes` in Node or
        `crypto.getRandomValues` in a browser.
      flags: [weak, critical]
    patterns:
      - pattern-either:
          - pattern-inside: const $NAME = ...;
          - pattern-inside: let $NAME = ...;
          - pattern-inside: var $NAME = ...;
      - pattern: Math.random()
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|token|secret|nonce|salt|iv|seed|password|credential).*

  # ------------------------------------------------------------------
  # THE TAINT SIBLING (ADR-0030, owed from ADR-0028).
  #
  # The name-scoped rule above can only see the NAME. A value called `material`
  # or `buf` that reaches a key sink is a key-recovery bug and was invisible,
  # while the cipher it fed was reported normally.
  #
  # BOTH RULES SHIP. Neither is a superset:
  #
  #   * the name-scoped rule catches `const token = Math.random()` with NO sink
  #     in the same function -- taint is intra-procedural, so a value returned
  #     to a caller is invisible to this rule;
  #   * this rule catches the flowing-but-badly-named case the name says
  #     nothing about.
  #
  # Where both fire they must produce ONE component. They agree on algorithm,
  # primitive, usage and params, so they carry one identity and the normaliser
  # folds them -- the ADR-0026 pattern, re-made for JS sinks. `flags` must stay
  # equal between the two for that to hold: `critical` sets `params.flagged`,
  # and a params mismatch would split the identity and double-report the same
  # weak key. tests/test_js_rng_taint.py asserts the single component.
  # ------------------------------------------------------------------
  - id: js-math-random-dataflow
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: "ecdat|"
    metadata:
      algorithm: Math.random
      primitive: drbg
      usage: unknown
      asset_type: algorithm
      quantum_note: >-
        `Math.random` is not a CSPRNG; ECMA-262 s21.4.2.28 states it carries no
        security guarantee, and V8 implements it with xorshift128+, whose state
        is recoverable from a few observed outputs. Caught here by DATAFLOW
        rather than by the variable's name: the value reaches a key, MAC or
        token sink, which is what makes it a key-recovery bug regardless of
        what it was called on the way. Recoverable TODAY -- no quantum computer
        required. NIST SP 800-133 Rev.2 s4 requires an approved RBG
        (SP 800-90A Rev.1). Use `crypto.randomBytes` or
        `crypto.getRandomValues`.
      flags: [weak, critical, dataflow]
    pattern-sources:
      - pattern: Math.random()
    pattern-sinks:
      - pattern: crypto.createCipheriv($S, $KEY, ...)
      - pattern: createCipheriv($S, $KEY, ...)
      - pattern: crypto.createHmac($D, $KEY)
      - pattern: createHmac($D, $KEY)
      - pattern: crypto.createSecretKey(...)
      - pattern: jwt.sign(...)
      - pattern: new Buffer.from(...)
