# JWT signing in JavaScript / TypeScript (jsonwebtoken).
#
# Sources:
#   RFC 7518 (JSON Web Algorithms) -- the `alg` registry.
#   RFC 8725 (JWT Best Current Practices) s3.1 -- reject `alg: none`;
#     s2.1 -- algorithm confusion between the HMAC and RSA families.
#   NIST IR 8547 -- RSA and ECDSA signatures deprecated after 2030, disallowed
#     after 2035.
#   node-jsonwebtoken (github.com/auth0/node-jsonwebtoken); CVE-2015-9235 is
#     the original `alg: none` / algorithm-confusion advisory for this library.
#
# ONE RULE PER FAMILY, matching the Python and Go packs. `metadata.algorithm`
# is per-rule and the family decides the migration: RS256/ES256 are Shor-broken
# and become ML-DSA, HS256 is symmetric and only needs a key-size review, and
# `none` is not a signature at all. One rule for all four would give one answer
# to four different questions.
rules:
  - id: js-jwt-rsa
    languages: [javascript, typescript]
    severity: WARNING
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: RSA
      primitive: signature
      usage: sign
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        RS*/PS* JWTs are RSA (PKCS#1 v1.5 and PSS) signatures. Broken outright
        by Shor; deprecated after 2030 and disallowed after 2035 (NIST IR
        8547). Replace with ML-DSA (FIPS 204). RFC 8725 s2.1 additionally warns
        against algorithm confusion between the RSA and HMAC families at
        verification time -- the bug behind CVE-2015-9235 in this library.
      flags: [quantum-vulnerable]
    # PROPAGATION-AWARE MATCHING (ADR-0028).
    #
    # `metavariable-pattern` is evaluated against the PROPAGATED value, so
    # `const alg = "RS256"` followed by the call below is caught.
    # `metavariable-regex` cannot: it tests the SOURCE TEXT bound to the
    # metavariable, which is the variable's NAME whenever the value was
    # assigned earlier. For the JWT rules that hole was an AUTHENTICATION
    # BYPASS -- `const alg = "none"` produced no finding at all, and RFC 8725
    # s3.1 requires `alg: none` to be rejected outright.
    #
    # Both branches ship; the union is wider than either, and the two agree on
    # every identifying field so a site matching both carries ONE identity.
    pattern-either:
      - patterns:
          - pattern: 'jwt.sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"RS256"'
                - pattern: '"RS384"'
                - pattern: '"RS512"'
                - pattern: '"PS256"'
                - pattern: '"PS384"'
                - pattern: '"PS512"'
      - patterns:
          - pattern: 'sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"RS256"'
                - pattern: '"RS384"'
                - pattern: '"RS512"'
                - pattern: '"PS256"'
                - pattern: '"PS384"'
                - pattern: '"PS512"'
      - patterns:
          - pattern: 'jwt.sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](RS|PS)(256|384|512)["']$
      - patterns:
          - pattern: 'sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](RS|PS)(256|384|512)["']$

  # USAGE = VERIFY (ADR-0030). Split out of `js-jwt-rsa`, which matched this
  # call and reported `usage: sign` -- so every token VERIFIER in an estate was
  # recommended a signing migration. Verification is also the side that must
  # move FIRST: nothing can accept an ML-DSA token until its verifier does.
  - id: js-jwt-rsa-verify
    languages: ['javascript', 'typescript']
    severity: WARNING
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: RSA
      primitive: signature
      usage: verify
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        RS*/PS* JWT VERIFICATION. The signature scheme is broken by Shor and
        disallowed after 2035 (NIST IR 8547), and a verifier is where the
        migration starts: a service cannot be sent ML-DSA (FIPS 204) tokens
        until it accepts them, so verify sites lead and sign sites follow.
        RFC 8725 s2.1 also requires the expected algorithm to be pinned at
        verification rather than read from the token header.
      flags: [quantum-vulnerable]
    pattern-either:
      - patterns:
          - pattern: 'jwt.verify($TOKEN, $KEY, {..., algorithms: [$ALG], ...})'
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"RS256"'
                - pattern: '"RS384"'
                - pattern: '"RS512"'
                - pattern: '"PS256"'
                - pattern: '"PS384"'
                - pattern: '"PS512"'
      - patterns:
          - pattern: 'jwt.verify($TOKEN, $KEY, {..., algorithms: [$ALG], ...})'
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["'](RS|PS)(256|384|512)["']$
  - id: js-jwt-ecdsa
    languages: [javascript, typescript]
    severity: WARNING
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: ECDSA
      primitive: signature
      usage: sign
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        ES* JWTs are ECDSA signatures over a NIST prime curve. The discrete log
        is broken by Shor with fewer logical qubits than RSA-2048 needs, so EC
        falls first; deprecated after 2030, disallowed after 2035 (NIST IR
        8547). Replace with ML-DSA (FIPS 204).
      flags: [quantum-vulnerable]
    # PROPAGATION-AWARE MATCHING (ADR-0028).
    #
    # `metavariable-pattern` is evaluated against the PROPAGATED value, so
    # `const alg = "ES256"` followed by the call below is caught.
    # `metavariable-regex` cannot: it tests the SOURCE TEXT bound to the
    # metavariable, which is the variable's NAME whenever the value was
    # assigned earlier. For the JWT rules that hole was an AUTHENTICATION
    # BYPASS -- `const alg = "none"` produced no finding at all, and RFC 8725
    # s3.1 requires `alg: none` to be rejected outright.
    #
    # Both branches ship; the union is wider than either, and the two agree on
    # every identifying field so a site matching both carries ONE identity.
    pattern-either:
      - patterns:
          - pattern: 'jwt.sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"ES256"'
                - pattern: '"ES384"'
                - pattern: '"ES512"'
      - patterns:
          - pattern: 'sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"ES256"'
                - pattern: '"ES384"'
                - pattern: '"ES512"'
      - patterns:
          - pattern: 'jwt.sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["']ES(256|384|512)["']$
      - patterns:
          - pattern: 'sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["']ES(256|384|512)["']$

  # USAGE = VERIFY (ADR-0030). Split out of `js-jwt-ecdsa`, which matched this
  # call and reported `usage: sign`.
  - id: js-jwt-ecdsa-verify
    languages: ['javascript', 'typescript']
    severity: INFO
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: ECDSA
      primitive: signature
      usage: verify
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        ES* JWT VERIFICATION. ECDSA falls to Shor with fewer logical qubits than RSA-2048 needs; disallowed after 2035 (NIST IR 8547). A verifier must accept ML-DSA (FIPS 204) before any signer can emit it.
      flags: [quantum-vulnerable]
    pattern-either:
      - patterns:
          - pattern: 'jwt.verify($TOKEN, $KEY, {..., algorithms: [$ALG], ...})'
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"ES256"'
                - pattern: '"ES384"'
                - pattern: '"ES512"'
      - patterns:
          - pattern: 'jwt.verify($TOKEN, $KEY, {..., algorithms: [$ALG], ...})'
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["']ES(256|384|512)["']$
  - id: js-jwt-hmac
    languages: [javascript, typescript]
    severity: INFO
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: HMAC
      primitive: mac
      usage: sign
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        HS* JWTs are HMAC-SHA2 (RFC 7518). Symmetric, so Shor does not apply
        and Grover only halves the effective key strength -- HS256 with a
        256-bit secret keeps ~128-bit security. This is a key-management
        question (RFC 8725 s3.5 requires a high-entropy secret), not a
        post-quantum migration.
      flags: [symmetric]
    # PROPAGATION-AWARE MATCHING (ADR-0028).
    #
    # `metavariable-pattern` is evaluated against the PROPAGATED value, so
    # `const alg = "HS256"` followed by the call below is caught.
    # `metavariable-regex` cannot: it tests the SOURCE TEXT bound to the
    # metavariable, which is the variable's NAME whenever the value was
    # assigned earlier. For the JWT rules that hole was an AUTHENTICATION
    # BYPASS -- `const alg = "none"` produced no finding at all, and RFC 8725
    # s3.1 requires `alg: none` to be rejected outright.
    #
    # Both branches ship; the union is wider than either, and the two agree on
    # every identifying field so a site matching both carries ONE identity.
    pattern-either:
      - patterns:
          - pattern: 'jwt.sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"HS256"'
                - pattern: '"HS384"'
                - pattern: '"HS512"'
      - patterns:
          - pattern: 'sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"HS256"'
                - pattern: '"HS384"'
                - pattern: '"HS512"'
      - patterns:
          - pattern: 'jwt.sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["']HS(256|384|512)["']$
      - patterns:
          - pattern: 'sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["']HS(256|384|512)["']$

  # USAGE = VERIFY (ADR-0030). Split out of `js-jwt-hmac`, which matched this
  # call and reported `usage: sign`.
  - id: js-jwt-hmac-verify
    languages: ['javascript', 'typescript']
    severity: INFO
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: HMAC
      primitive: mac
      usage: verify
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        HS* JWT VERIFICATION. Symmetric, so Shor does not apply and Grover only halves the effective strength -- a key-management question, not a migration. RFC 8725 s2.1 requires the expected algorithm to be pinned at verification: accepting the token's own `alg` is the algorithm-confusion bug behind CVE-2015-9235.
      flags: [symmetric]
    pattern-either:
      - patterns:
          - pattern: 'jwt.verify($TOKEN, $KEY, {..., algorithms: [$ALG], ...})'
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"HS256"'
                - pattern: '"HS384"'
                - pattern: '"HS512"'
      - patterns:
          - pattern: 'jwt.verify($TOKEN, $KEY, {..., algorithms: [$ALG], ...})'
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["']HS(256|384|512)["']$
  - id: js-jwt-none
    languages: [javascript, typescript]
    severity: ERROR
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: none
      primitive: signature
      usage: sign
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        `alg: none` disables signature verification entirely: any party can
        mint a token the service will accept. RFC 8725 s3.1 requires it to be
        rejected, and CVE-2015-9235 is this exact bypass in this library. A
        total authentication bypass today, with nothing to do with quantum
        computing.
      flags: [weak, critical]
    # PROPAGATION-AWARE MATCHING (ADR-0028).
    #
    # `metavariable-pattern` is evaluated against the PROPAGATED value, so
    # `const alg = "none"` followed by the call below is caught.
    # `metavariable-regex` cannot: it tests the SOURCE TEXT bound to the
    # metavariable, which is the variable's NAME whenever the value was
    # assigned earlier. For the JWT rules that hole was an AUTHENTICATION
    # BYPASS -- `const alg = "none"` produced no finding at all, and RFC 8725
    # s3.1 requires `alg: none` to be rejected outright.
    #
    # Both branches ship; the union is wider than either, and the two agree on
    # every identifying field so a site matching both carries ONE identity.
    pattern-either:
      - patterns:
          - pattern: 'jwt.sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"none"'
                - pattern: '"None"'
                - pattern: '"NONE"'
      - patterns:
          - pattern: 'sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"none"'
                - pattern: '"None"'
                - pattern: '"NONE"'
      - patterns:
          - pattern: 'jwt.sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["']none["']$
      - patterns:
          - pattern: 'sign($CLAIMS, $KEY, {..., algorithm: $ALG, ...})'
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["']none["']$

  # USAGE = VERIFY (ADR-0030). Split out of `js-jwt-none`, which matched this
  # call and reported `usage: sign`.
  - id: js-jwt-none-verify
    languages: ['javascript', 'typescript']
    severity: INFO
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: none
      primitive: signature
      usage: verify
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        `alg: none` accepted at VERIFICATION is the complete bypass -- the service will accept a token anyone can mint. RFC 8725 s3.1 requires it to be rejected. Nothing to do with quantum.
      flags: [quantum-vulnerable]
    pattern-either:
      - patterns:
          - pattern: 'jwt.verify($TOKEN, $KEY, {..., algorithms: [$ALG], ...})'
          - metavariable-pattern:
              metavariable: $ALG
              pattern-either:
                - pattern: '"none"'
                - pattern: '"None"'
                - pattern: '"NONE"'
      - patterns:
          - pattern: 'jwt.verify($TOKEN, $KEY, {..., algorithms: [$ALG], ...})'
          - metavariable-regex:
              metavariable: $ALG
              regex: ^["']none["']$
