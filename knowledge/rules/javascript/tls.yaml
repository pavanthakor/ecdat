# TLS configuration in JavaScript / TypeScript.
#
# Sources:
#   RFC 8996 -- TLS 1.0 and TLS 1.1 are deprecated and MUST NOT be used.
#   RFC 8446 -- TLS 1.3.
#   NIST SP 800-52 Rev.2 -- TLS 1.2 minimum for US federal systems.
#   RFC 7465 -- RC4 prohibited in TLS.
#   CVE-2016-2183 (Sweet32) -- 3DES suites over long-lived connections.
#   Node.js `tls.createSecureContext`, `https.Agent` options `minVersion`,
#     `maxVersion`, `ciphers` (nodejs.org/api/tls.html).
#
# A TLS version is a PROTOCOL: `asset_type: protocol`, `primitive: unknown`.
# The suites it negotiates are the cryptography and are recorded separately
# (knowledge/rules/README.md).
rules:
  - id: js-tls-minversion
    languages: [javascript, typescript]
    severity: WARNING
    message: "ecdat|version=$VERSION"
    metadata:
      algorithm: TLS
      primitive: unknown
      usage: unknown
      asset_type: protocol
      capture:
        version: $VERSION
      quantum_note: >-
        The negotiated protocol floor. TLS 1.0 and 1.1 are deprecated and MUST
        NOT be used (RFC 8996); NIST SP 800-52 Rev.2 requires TLS 1.2 as a
        minimum. Quantum-wise the version matters because only TLS 1.3
        (RFC 8446) carries the key-share extension the hybrid ML-KEM groups
        use -- a client pinned below 1.3 cannot negotiate a post-quantum key
        exchange at all, however capable its runtime becomes.
      flags: [override]
    patterns:
      - pattern-either:
          - pattern: '{..., minVersion: $VERSION, ...}'
          - pattern: '{..., secureProtocol: $VERSION, ...}'
      - metavariable-regex:
          metavariable: $VERSION
          regex: ^["'](TLSv1|TLSv1\.1|TLSv1_method|TLSv1_1_method|SSLv3)["']$

  - id: js-tls-ciphers
    languages: [javascript, typescript]
    severity: WARNING
    message: "ecdat|"
    metadata:
      algorithm: TLS
      primitive: unknown
      usage: unknown
      asset_type: protocol
      quantum_note: >-
        An explicit cipher list overrides Node's defaults, which track
        OpenSSL's and are kept current by the Node security team. Pinning a
        list is how RC4 (prohibited by RFC 7465) and 3DES (Sweet32,
        CVE-2016-2183) survive in production long after the runtime stopped
        offering them. The suites themselves are symmetric and only
        Grover-affected; the key exchange they pair with is the
        quantum-vulnerable half, and pinning the list is also what prevents a
        hybrid group being negotiated later.
      flags: [override]
    pattern-either:
      - pattern: '{..., ciphers: $CIPHERS, ...}'
