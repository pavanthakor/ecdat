# JWT signing in Go (github.com/golang-jwt/jwt).
#
# Sources:
#   RFC 7518 (JSON Web Algorithms) -- the `alg` registry.
#   RFC 8725 (JWT Best Current Practices) s3.1 -- reject `alg: none`; s2.1 --
#     algorithm confusion between HMAC and RSA verification keys.
#   NIST IR 8547 -- RSA and ECDSA signatures deprecated after 2030, disallowed
#     after 2035.
#   github.com/golang-jwt/jwt v4/v5 -- the `jwt.SigningMethod*` constants.
#
# ONE RULE PER FAMILY, matching the Python pack's shape (py-jwt-rsa,
# py-jwt-ecdsa, py-jwt-hmac, py-jwt-none). The family decides the migration and
# `metadata.algorithm` is per-rule, so it cannot be captured: RS256 and ES256
# are Shor-broken and become ML-DSA, while HS256 is symmetric and only
# Grover-affected -- a key-size review, not a migration. Collapsing them into
# one rule would produce one answer for two different problems.
#
# `params.alg` holds the Go CONSTANT NAME (`SigningMethodRS256`), because that
# is what the source actually says. Go spells the algorithm in an identifier
# rather than a string, and reporting the identifier keeps the finding
# traceable to the line it came from.
rules:
  - id: go-jwt-rsa
    languages: [go]
    severity: WARNING
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: RSA
      primitive: signature
      usage: sign
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        RS*/PS* JWTs are RSA (PKCS#1 v1.5 and PSS) signatures. Broken outright
        by Shor; deprecated after 2030 and disallowed after 2035 (NIST IR
        8547). Replace with ML-DSA (FIPS 204). RFC 8725 s2.1 additionally warns
        against algorithm confusion between the RSA and HMAC families at
        verification time.
      flags: [quantum-vulnerable]
    patterns:
      - pattern: jwt.$ALG
      - metavariable-regex:
          metavariable: $ALG
          regex: ^SigningMethod(RS|PS)(256|384|512)$

  - id: go-jwt-ecdsa
    languages: [go]
    severity: WARNING
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: ECDSA
      primitive: signature
      usage: sign
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        ES* JWTs are ECDSA signatures over a NIST prime curve. The discrete log
        is broken by Shor with fewer logical qubits than RSA-2048 needs, so EC
        falls first; deprecated after 2030, disallowed after 2035 (NIST IR
        8547). Replace with ML-DSA (FIPS 204).
      flags: [quantum-vulnerable]
    patterns:
      - pattern: jwt.$ALG
      - metavariable-regex:
          metavariable: $ALG
          regex: ^SigningMethodES(256|384|512)$

  - id: go-jwt-hmac
    languages: [go]
    severity: INFO
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: HMAC
      primitive: mac
      usage: sign
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        HS* JWTs are HMAC-SHA2 (RFC 7518). Symmetric, so Shor does not apply
        and Grover only halves the effective key strength -- HS256 with a
        256-bit secret keeps ~128-bit security. This is a key-management
        question (RFC 8725 s3.5 requires a high-entropy secret), not a
        post-quantum migration.
      flags: [symmetric]
    patterns:
      - pattern: jwt.$ALG
      - metavariable-regex:
          metavariable: $ALG
          regex: ^SigningMethodHS(256|384|512)$

  - id: go-jwt-none
    languages: [go]
    severity: ERROR
    message: "ecdat|alg=$ALG"
    metadata:
      algorithm: none
      primitive: signature
      usage: sign
      asset_type: algorithm
      capture:
        alg: $ALG
      quantum_note: >-
        `alg: none` disables signature verification entirely: any party can
        mint a token the service will accept. RFC 8725 s3.1 requires it to be
        rejected. This is a total authentication bypass today and has nothing
        to do with quantum computing.
      flags: [weak, critical]
    patterns:
      - pattern: jwt.$ALG
      - metavariable-regex:
          metavariable: $ALG
          regex: ^SigningMethodNone$
