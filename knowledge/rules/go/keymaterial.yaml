# Key material embedded in Go source.
#
# Sources:
#   NIST SP 800-57 Part 1 Rev.5 s5.3 -- key material must be protected for its
#     whole lifetime; a key in source control has no lifetime bound at all.
#   NIST SP 800-133 Rev.2 -- keys must come from an approved RBG, not a literal.
#   CWE-321 (hard-coded cryptographic key), CWE-798 (hard-coded credentials).
#   RFC 7468 -- textual encodings of PKIX/PKCS structures (the PEM banners).
#   ITU-T X.690 s8.1.3 -- DER length octets: the `MII` / `MIG` header shape.
#   Go standard library -- aes.NewCipher(key), des.NewCipher(key),
#     des.NewTripleDESCipher(key), rc4.NewCipher(key), hmac.New(h, key),
#     cipher.NewCBCEncrypter/Decrypter(b, iv); golang-jwt -- Token.SignedString
#     (key). The key parameters the sink rule knows.
#
# CORROBORATION, NOT A NAME (ADR-0034). Until ADR-0034 `go-hardcoded-key` fired
# on any key-ish NAME holding a literal -- a cookie name, a header name, a
# context key. A name is not evidence. A literal is reported only when
# something corroborates it:
#
#   go-pem-block                a PEM block                    confidence 1.0
#   go-hardcoded-key-der        a base64 DER structure         confidence 1.0
#   go-hardcoded-key            it reaches a key, IV, HMAC     confidence 1.0
#                               or signing parameter
#   go-hardcoded-key-candidate  a key-ish name, a high-        confidence 0.5,
#                               entropy 32+ character          marked `candidate`
#                               literal, and nothing else
#
# REDACTION. Every rule sets `redact: true`, so the snippet becomes
# `<redacted key material>` before it reaches a Finding. CLAUDE.md: no secret
# key material is ever stored. `redact` does NOT sanitise the message, so no
# rule interpolates a metavariable that can bind to the secret: the sink rule
# and the candidate carry only `holder=`, the IDENTIFIER the literal was
# declared under. No metavariable here is a prefix of `$HOLDER` or `$NAME` --
# semgrep substitutes a bound metavariable into any longer, UNBOUND name it
# prefixes. That was measured on THIS pack: with `hmac.New($H, ...)` bound and
# `$HOLDER` unbound, the message read `holder=sha256.NewOLDER` (ADR-0034 STEP 0).
#
# A planted sentinel in testdata/go_fixtures proves redaction holds:
# tests/test_rules_go.py::test_no_planted_secret_reaches_any_go_finding.
rules:
  - id: go-hardcoded-key
    languages: [go]
    severity: ERROR
    message: "ecdat|holder=$HOLDER"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      holder_metavar: $HOLDER
      quantum_note: >-
        A literal that reaches a key, IV, HMAC-key or signing-secret parameter:
        hard-coded key material, corroborated by where it goes rather than by
        what it is called. Everyone with repository access has the key, it
        survives in git history after removal, and rotating it needs a code
        change and a redeploy (CWE-321; NIST SP 800-57 Part 1 Rev.5 s5.3).
        Quantum is irrelevant -- there is nothing to break. Load it from a KMS
        or a secret store, generated by crypto/rand (NIST SP 800-133 Rev.2).
      flags: [key-material, critical]
    mode: taint
    options:
      # A call's result is not its arguments. Without this, a KDF salt
      # (`pbkdf2.Key(pw, []byte("salt"), ...)`) flowed through the call into
      # the cipher and was reported as the key (STEP 0). A `[]byte(...)`
      # conversion is not a call and still carries taint.
      taint_assume_safe_functions: true
      # With propagation on, a const-backed argument ALSO matched the literal
      # source at its use, and the key was reported twice.
      constant_propagation: false
    pattern-sources:
      # A literal that initialises a named holder. The holder travels to the
      # message.
      - patterns:
          - pattern-either:
              - pattern-inside: var $HOLDER = "..."
              - pattern-inside: var $HOLDER = []byte("...")
              - pattern-inside: const $HOLDER = "..."
              - pattern-inside: $HOLDER := "..."
              - pattern-inside: $HOLDER := []byte("...")
          - pattern: '"$LIT"'
          # Eight characters or more -- a DES key, the shortest worth
          # protecting -- and never a PEM or DER literal: go-pem-block and
          # go-hardcoded-key-der own a SHAPED literal, so it is reported once.
          - metavariable-regex:
              metavariable: $LIT
              regex: '^(?![\s\S]*-----(?:BEGIN|END))(?!MI[IG][A-Za-z0-9+/]{61})[\s\S]{8,}$'
      # A literal written anywhere else -- inline at the sink -- holds nothing.
      - patterns:
          - pattern: '"$LIT"'
          - pattern-not-inside: var $VARNAME = "..."
          - pattern-not-inside: var $VARNAME = []byte("...")
          - pattern-not-inside: const $VARNAME = "..."
          - pattern-not-inside: $VARNAME := "..."
          - pattern-not-inside: $VARNAME := []byte("...")
          - metavariable-regex:
              metavariable: $LIT
              regex: '^(?![\s\S]*-----(?:BEGIN|END))(?!MI[IG][A-Za-z0-9+/]{61})[\s\S]{8,}$'
      # A PACKAGE-LEVEL var. Go globals are mutable, so neither constant
      # propagation nor intra-procedural taint follows one into a function
      # (STEP 0) -- and `var key = []byte("...")` is THE idiomatic Go
      # hard-coded key. So every use of the global after its declaration is
      # the source.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  var $HOLDER = []byte("$GLIT")
                  ...
              - pattern-inside: |
                  var $HOLDER = "$GLIT"
                  ...
          - metavariable-regex:
              metavariable: $GLIT
              regex: '^(?![\s\S]*-----(?:BEGIN|END))(?!MI[IG][A-Za-z0-9+/]{61})[\s\S]{8,}$'
          - pattern: $HOLDER
    pattern-sanitizers:
      # An ASSEMBLED key -- a constant joined to a runtime value -- is not a
      # hard-coded key: the literal is a part of it.
      - pattern: $LEFT + $RIGHT
    # One sink per shape: two shapes that match the SAME call must not share a
    # pattern-either -- semgrep keeps one binding per range (STEP 0).
    pattern-sinks:
      - patterns:
          - pattern: aes.NewCipher($ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: aes.NewCipher([]byte($ARG))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: des.NewCipher($ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: des.NewCipher([]byte($ARG))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: des.NewTripleDESCipher($ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: des.NewTripleDESCipher([]byte($ARG))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: rc4.NewCipher($ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: rc4.NewCipher([]byte($ARG))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: hmac.New($HASHFN, $ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: hmac.New($HASHFN, []byte($ARG))
          - focus-metavariable: $ARG
      # The IV.
      - patterns:
          - pattern: cipher.NewCBCEncrypter($BLOCK, $ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: cipher.NewCBCEncrypter($BLOCK, []byte($ARG))
          - focus-metavariable: $ARG
      - patterns:
          - pattern: cipher.NewCBCDecrypter($BLOCK, $ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: cipher.NewCBCDecrypter($BLOCK, []byte($ARG))
          - focus-metavariable: $ARG
      # The JWT signing secret (golang-jwt).
      - patterns:
          - pattern: $TOKEN.SignedString($ARG)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: $TOKEN.SignedString([]byte($ARG))
          - focus-metavariable: $ARG

  - id: go-hardcoded-key-der
    languages: [go]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      quantum_note: >-
        A base64 DER structure embedded in source: key material by its shape.
        `MII` / `MIG` is a DER SEQUENCE with a long-form length (ITU-T X.690
        s8.1.3) -- the header of every RSA key (RFC 8017), PKCS #8 key (RFC
        5958) and X.509 certificate (RFC 5280). It is deliberately not decoded,
        because reading the DER would mean reading the key, so it may be a
        private key (CWE-321), a public key or a certificate; any of them here
        is rotated only by a code change and a redeploy.
      flags: [key-material, critical]
    options:
      # With propagation on, the literal ALSO matched at every use of its
      # constant, and one blob was reported once per use (STEP 0).
      constant_propagation: false
    patterns:
      - pattern: '"$LIT"'
      # A SEQUENCE of 128+ bytes. The short forms (Ed25519, X25519, P-256
      # SEC1) share no header distinct from base64 text that starts with "0"
      # (STEP 0), so they are left to the other branches.
      - metavariable-regex:
          metavariable: $LIT
          regex: '^MI[IG][A-Za-z0-9+/]{61,}'
      # A DER line inside a PEM block is go-pem-block's.
      - pattern-not-regex: '-----BEGIN[A-Z0-9 ]*-----[\s\S]*?-----END[A-Z0-9 ]*-----'

  - id: go-hardcoded-key-candidate
    languages: [go]
    severity: WARNING
    message: "ecdat|holder=$NAME"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: key
      redact: true
      holder_metavar: $NAME
      # A string: semgrep 1.176.1 refuses a YAML float anywhere in a rule.
      confidence: "0.5"
      quantum_note: >-
        A CANDIDATE for analyst review, not an assertion: a key-ish name holding
        a high-entropy literal of 32 or more hex or base64 characters that ECDAT
        did not see reach a key parameter. It may be a key used through a helper
        or another package -- OSS taint is intra-procedural -- or an API token, a
        test vector, a digest named like a key. If it is a key, it is CWE-321
        (NIST SP 800-57 Part 1 Rev.5 s5.3): move it to a KMS or secret store.
      flags: [key-material, candidate]
    patterns:
      - pattern-either:
          - pattern: var $NAME = $LITERAL
          - pattern: const $NAME = $LITERAL
          - pattern: $NAME := $LITERAL
          - pattern: var $NAME = []byte($LITERAL)
          - pattern: $NAME := []byte($LITERAL)
      # The name is the premise, never the proof. `iv`, `nonce`, `salt` and
      # `token` are not here: none is a secret key, and `iv` is a substring of
      # `private` and `archive`.
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|secret|passphrase|password|passwd|credential).*
      # The shape: 32+ hex/base64 characters with a digit and a letter, the
      # whole literal, and not a DER header. The optional parentheses are
      # load-bearing: inside `[]byte($LITERAL)` semgrep binds the
      # PARENTHESISED argument, `("...")`, not the bare string.
      - metavariable-regex:
          metavariable: $LITERAL
          regex: '^\(?(["`])(?!MI[IG])(?=[^"`]*[0-9])(?=[^"`]*[A-Za-z])[A-Za-z0-9+/]{32,}={0,2}\1\)?$'
      # The entropy: semgrep's analyzer rejects repeating patterns
      # (`deadbeef` x4), prose and camelCase names, and accepts random hex and
      # base64 (STEP 0).
      - metavariable-analysis:
          analyzer: entropy
          metavariable: $LITERAL

  - id: go-pem-block
    languages: [go]
    severity: ERROR
    message: "ecdat|"
    metadata:
      algorithm: unknown
      primitive: unknown
      usage: unknown
      asset_type: certificate
      redact: true
      quantum_note: >-
        A PEM block embedded in source (RFC 7468). ECDAT records that key
        material or a certificate is present and where, and deliberately does
        not parse it: the algorithm and key size would require reading the
        DER, and the point of this rule is that the bytes must not be read into
        the CBOM at all. A private key here is CWE-321; a certificate here
        cannot be rotated without a redeploy.
      flags: [key-material, critical]
    patterns:
      - pattern-regex: -----BEGIN[A-Z0-9 ]*-----
