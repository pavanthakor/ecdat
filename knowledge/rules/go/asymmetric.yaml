# Go public-key cryptography -- the Shor-broken family.
#
# Sources:
#   NIST IR 8547 (initial public draft, Nov 2024) -- RSA, ECDSA, ECDH, DH and
#     EdDSA are deprecated after 2030 and disallowed after 2035.
#   FIPS 203 (ML-KEM), FIPS 204 (ML-DSA), FIPS 205 (SLH-DSA), Aug 2024 -- the
#     approved replacements.
#   NIST SP 800-56A Rev.3 -- ECDH key agreement.
#   Go standard library: crypto/rsa, crypto/ecdsa, crypto/ed25519, crypto/ecdh,
#     crypto/elliptic (pkg.go.dev, Go 1.22).
#
# usage=unknown at key generation is deliberate and matches the Python pack: a
# generated key may go on to sign or to transport, and the correct PQC
# replacement differs (ML-DSA vs ML-KEM). The correlator refines usage from the
# use site; guessing here manufactures a wrong migration plan. See ADR-0004.
rules:
  - id: go-rsa-keygen
    languages: [go]
    severity: WARNING
    message: "ecdat|key_size=$KEYSIZE"
    metadata:
      algorithm: RSA
      primitive: pke
      usage: unknown
      asset_type: algorithm
      keysize_metavar: $KEYSIZE
      quantum_note: >-
        Broken outright by Shor's algorithm; key size does not help -- RSA-4096
        falls to the same attack as RSA-2048. Deprecated after 2030 and
        disallowed after 2035 (NIST IR 8547). Replacement depends on usage:
        ML-KEM (FIPS 203) for key transport, ML-DSA (FIPS 204) for signatures.
      flags: [quantum-vulnerable]
    pattern-either:
      - pattern: rsa.GenerateKey($RAND, $KEYSIZE)
      - pattern: rsa.GenerateMultiPrimeKey($RAND, $N, $KEYSIZE)

  - id: go-ecdsa-keygen
    languages: [go]
    severity: WARNING
    message: "ecdat|curve=$CURVE"
    metadata:
      algorithm: ECDSA
      primitive: signature
      usage: unknown
      asset_type: algorithm
      capture:
        curve: $CURVE
      quantum_note: >-
        Elliptic-curve discrete log is broken by Shor; a 256-bit curve needs
        fewer logical qubits than RSA-2048, so EC falls first. Deprecated after
        2030 and disallowed after 2035 (NIST IR 8547). Replace signatures with
        ML-DSA (FIPS 204) or SLH-DSA (FIPS 205).
      flags: [quantum-vulnerable]
    pattern-either:
      - pattern: ecdsa.GenerateKey($CURVE, $RAND)

  - id: go-ed25519-keygen
    languages: [go]
    severity: WARNING
    message: "ecdat|"
    metadata:
      algorithm: Ed25519
      primitive: signature
      usage: unknown
      asset_type: algorithm
      quantum_note: >-
        EdDSA over Curve25519. Classically strong, but the discrete log it rests
        on is broken by Shor exactly as ECDSA's is; NIST IR 8547 deprecates
        EdDSA after 2030 and disallows it after 2035. Replace with ML-DSA
        (FIPS 204), or a composite Ed25519+ML-DSA signature during transition.
      flags: [quantum-vulnerable]
    pattern-either:
      - pattern: ed25519.GenerateKey($RAND)

  - id: go-ecdh-curve
    languages: [go]
    severity: WARNING
    message: "ecdat|curve=$CURVE"
    metadata:
      algorithm: ECDH
      primitive: key-agreement
      usage: key-exchange
      asset_type: algorithm
      capture:
        curve: $CURVE
      quantum_note: >-
        Elliptic-curve Diffie-Hellman (NIST SP 800-56A Rev.3). Broken by Shor,
        and uniquely urgent: a recorded handshake can be decrypted once a
        cryptanalytically relevant quantum computer exists, so harvest-now
        decrypt-later applies today. Replace with ML-KEM (FIPS 203) or a hybrid
        X25519+ML-KEM group during transition.
      flags: [quantum-vulnerable]
    pattern-either:
      - pattern: ecdh.$CURVE()
