# Go call sites whose API NAMES the usage (ADR-0030).
#
# Go spells key transport and verification in the function name, which makes
# these the most reliable usage signals in any of the four packs -- no argument
# to read, no mode constant to follow.
#
# Sources: NIST IR 8547 ipd Table 1; FIPS 203 (ML-KEM); FIPS 204 (ML-DSA);
# RFC 8017 s7.1 (RSAES-OAEP); Go crypto/rsa package documentation.
rules:
  - id: go-rsa-key-transport
    languages: [go]
    severity: WARNING
    message: "ecdat|"
    metadata:
      algorithm: RSA
      primitive: pke
      usage: key-transport
      asset_type: algorithm
      quantum_note: >-
        RSA key transport: wrapping a symmetric key, not bulk encryption. The
        harvest-now-decrypt-later case -- a recorded ciphertext is decryptable
        once a cryptanalytically relevant quantum computer exists, so exposure
        starts when the traffic is captured rather than in 2035. Replace with
        ML-KEM (FIPS 203), not ML-DSA.
      flags: [quantum-vulnerable]
    pattern-either:
      - pattern: rsa.EncryptOAEP(...)
      - pattern: rsa.EncryptPKCS1v15(...)

  - id: go-rsa-verify
    languages: [go]
    severity: INFO
    message: "ecdat|"
    metadata:
      algorithm: RSA
      primitive: signature
      usage: verify
      asset_type: algorithm
      quantum_note: >-
        RSA signature verification. Disallowed after 2035 (NIST IR 8547), and
        the side that migrates first: nothing can be sent an ML-DSA (FIPS 204)
        signature until its verifier accepts one.
      flags: [quantum-vulnerable]
    pattern-either:
      - pattern: rsa.VerifyPKCS1v15(...)
      - pattern: rsa.VerifyPSS(...)

  - id: go-ecdsa-verify
    languages: [go]
    severity: INFO
    message: "ecdat|"
    metadata:
      algorithm: ECDSA
      primitive: signature
      usage: verify
      asset_type: algorithm
      quantum_note: >-
        ECDSA signature verification. Elliptic-curve discrete log falls to Shor
        before RSA does; disallowed after 2035 (NIST IR 8547). Replace with
        ML-DSA (FIPS 204) -- verify side first.
      flags: [quantum-vulnerable]
    pattern-either:
      - pattern: ecdsa.Verify(...)
      - pattern: ecdsa.VerifyASN1(...)
      - pattern: ed25519.Verify(...)
