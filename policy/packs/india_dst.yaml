# ECDAT India DST / National Quantum Mission migration pack.
#
# The national roadmap's deadlines and assurance expectations, as they apply to
# an inventoried cryptographic asset. This is the pack that makes ECDAT's first
# pillar -- India roadmap compliance -- something a scan can answer.
#
# ---------------------------------------------------------------------------
# VERIFICATION STATUS -- CONFIRMED against the primary source (2026-09-10)
# ---------------------------------------------------------------------------
# Every rule in this pack is `verified: true` and cites the published roadmap
# by document, URL and section:
#
#   DST/NQM "Report on Quantum-Safe Ecosystem in India: Roadmap to Quantum
#   Resiliency", May 2026
#   https://dst.gov.in/sites/default/files/Quantum-Safe-Ecosystem-in-India.pdf
#
#   Sec. 9.0  -- the phased timetable (2027 foundations/inventory, 2028
#                high-priority CII migration, 2029 full adoption), the seven
#                CII sectors, and the AES-128 -> AES-256 symmetric uplift.
#   Sec. 6.0 / Annexure B Table 1 -- assurance level L2A = software security
#                assurance.
#
# CORRECTION MADE ON CONFIRMATION. The first encoding of the CII sector list
# had four entries (defence, power, telecom, BFSI). The roadmap gives SEVEN:
# government, strategic, defence, power, telecom, transport and BFSI. Reading
# the source is what found it, and the omission was the silent kind -- an asset
# in a government or transport estate simply fell through to `other` and never
# fired the CII rule, so it under-scored with no error anywhere. `Sector` in
# core/scanner.py was widened to match; a sector this pack names that a Target
# cannot carry is a dead rule branch.
#
# These rules therefore SCORE again (ADR-0017): the engine adds a contribution
# only from a verified rule, and confirming the facts is what turned them back
# on -- no code change, exactly as the mechanism intends.

# ASSURANCE LEVELS. Only the software mapping is encoded (library / module /
# service -> L2A). Hardware, key-management and certificate-authority assurance
# levels are deliberately ABSENT rather than guessed: an invented assurance
# level is worse than a missing one, because it looks answered.
#
# CAP 20 on `criticality`. Below mosca's 30 and quantum's 40: which sector you
# are in sharpens a verdict, it does not create one. An asset that is not
# broken does not become critical by being in a bank.
pack: india_dst
version: 1
citation: >-
  Department of Science & Technology / National Quantum Mission post-quantum
  cryptography migration roadmap (May 2026). Deadlines and assurance levels as
  supplied to ECDAT; see the VERIFICATION STATUS note in this file's header.

caps:
  criticality: 20

rules:
  # Critical information infrastructure migrates first. Selects on
  # quantum_status, which is a VERDICT output -- the engine runs such rules in a
  # second pass, after the quantum pack has decided. See ADR-0008.
  - id: dst-cii-priority-migration
    when:
      # The roadmap's own seven CII sectors (Sec. 9.0). The first encoding of
      # this pack carried only four: government, strategic and transport were
      # missing, which silently under-scored every asset in them.
      sector:
        in: [government, strategic, defence, power, telecom, transport, bfsi]
      quantum_status: broken
    effect:
      score: 20
      category: criticality
      deadline: 2028-12-31
      labels: [CII, dst-cii-priority]
      action: >-
        Critical information infrastructure: migrate this high-priority system
        ahead of the general timetable. The CII deadline is 2028-12-31, a full
        year before general full adoption.
    citation: >-
      DST/NQM roadmap (May 2026) Sec. 9.0: quantum-vulnerable cryptography in
      critical information infrastructure -- government, strategic, defence,
      power, telecom, transport and BFSI -- carries the earlier 2028
      high-priority migration deadline.
    verified: true
    source: >-
      DST/NQM "Report on Quantum-Safe Ecosystem in India: Roadmap to Quantum
      Resiliency", May 2026,
      https://dst.gov.in/sites/default/files/Quantum-Safe-Ecosystem-in-India.pdf,
      Section 9.0

  # The EARLIEST obligation on a CII operator, and the one ECDAT itself
  # discharges: you cannot migrate what you have not inventoried. Scores 0 --
  # it is a milestone, not extra risk in the asset -- but it dates the work.
  - id: dst-cii-foundations-inventory
    when:
      sector:
        in: [government, strategic, defence, power, telecom, transport, bfsi]
      quantum_status: broken
    effect:
      score: 0
      category: criticality
      deadline: 2027-12-31
      labels: [CII, dst-cii-foundations]
      action: >-
        Critical information infrastructure: cryptographic discovery and
        inventory foundations must be complete by 2027-12-31, a year before the
        high-priority migration deadline. A CBOM for this system is the
        deliverable that discharges it.
    citation: >-
      DST/NQM roadmap (May 2026) Sec. 9.0: the phased timetable places
      foundations and cryptographic inventory for critical information
      infrastructure at end-2027, ahead of the 2028 high-priority migration
      milestone.
    verified: true
    source: >-
      DST/NQM "Report on Quantum-Safe Ecosystem in India: Roadmap to Quantum
      Resiliency", May 2026,
      https://dst.gov.in/sites/default/files/Quantum-Safe-Ecosystem-in-India.pdf,
      Section 9.0

  - id: dst-full-adoption
    when:
      quantum_status: broken
    effect:
      score: 0
      category: criticality
      deadline: 2029-12-31
      labels: [dst-full-adoption]
      action: >-
        Quantum-vulnerable cryptography must be replaced by the national
        full-adoption deadline of 2029-12-31, whatever the sector.
    citation: >-
      DST/NQM roadmap (May 2026): full adoption of post-quantum cryptography
      across all sectors by end-2029.
    verified: true
    source: >-
      DST/NQM "Report on Quantum-Safe Ecosystem in India: Roadmap to Quantum
      Resiliency", May 2026,
      https://dst.gov.in/sites/default/files/Quantum-Safe-Ecosystem-in-India.pdf,
      Section 9.0

  - id: dst-aes-128-uplift
    when:
      algorithm: AES
      key_size:
        max: 128
    effect:
      score: 0
      category: criticality
      labels: [dst-aes-uplift]
      action: >-
        Upgrade to AES-256. Grover halves the effective key strength, so
        AES-128 retains roughly 64 bits against a quantum adversary; AES-256
        retains 128. This is a key-size change, not an algorithm change.
    citation: >-
      DST/NQM roadmap (May 2026) symmetric-key uplift guidance; NIST IR 8547
      ipd Sec. 3 for the Grover halving; FIPS 197 for the key sizes.
    verified: true
    source: >-
      DST/NQM "Report on Quantum-Safe Ecosystem in India: Roadmap to Quantum
      Resiliency", May 2026,
      https://dst.gov.in/sites/default/files/Quantum-Safe-Ecosystem-in-India.pdf,
      Section 9.0

  - id: dst-assurance-software-l2a
    when:
      asset_type:
        in: [library, module, service]
    effect:
      score: 0
      category: criticality
      labels: ["assurance:L2A"]
    citation: >-
      DST/NQM roadmap (May 2026) assurance-level mapping for software
      cryptographic assets. Only the software mapping is encoded; hardware,
      key-management and CA levels are deliberately not guessed.
    verified: true
    source: >-
      DST/NQM "Report on Quantum-Safe Ecosystem in India: Roadmap to Quantum
      Resiliency", May 2026,
      https://dst.gov.in/sites/default/files/Quantum-Safe-Ecosystem-in-India.pdf,
      Section 6.0 / Annexure B Table 1
